<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>James KY Kim · 우진산업주식회사 · Business Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Fraunces', 'Noto Serif KR', 'serif'],
            sans:    ['Inter', 'Noto Sans KR', 'system-ui', 'sans-serif'],
            kserif:  ['Noto Serif KR', 'Fraunces', 'serif'],
          },
          colors: {
            ink:    '#1A1A1A',
            paper:  '#FAFAF7',
            crimson:'#EC4546',
          },
        },
      },
    }
  </script>
  <style>
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', 'Noto Sans KR', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #EDE9E2;
      background-image:
        radial-gradient(ellipse at 50% 0%, rgba(200,16,46,0.05) 0%, transparent 60%),
        linear-gradient(180deg, #EDE9E2 0%, #DDD7CC 100%);
      background-attachment: fixed;
      min-height: 100vh;
    }
    /* 90 x 54 mm = aspect ratio 5:3.
       Screen render at 5.6× scale: 504 x 302 px (readable).
       Print version at exact mm. */
    .card-screen {
      width: 504px;
      height: 302px;
      box-shadow: 0 30px 60px -25px rgba(0,0,0,0.35), 0 10px 20px -10px rgba(0,0,0,0.15);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    @media (max-width: 640px) {
      .card-screen { width: 92vw; height: calc(92vw * 0.6); }
    }
    .card-print { width: 90mm; height: 54mm; }
    .paper-grain {
      background-image:
        radial-gradient(circle at 20% 30%, rgba(0,0,0,0.012) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(0,0,0,0.012) 0%, transparent 50%);
    }
    .paper-grain-dark {
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.025) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.025) 0%, transparent 50%);
    }
    .hair-rule { height: 1px; background: currentColor; opacity: 0.18; }
    .red-rule  { height: 2px; background: #EC4546; }
    /* tabular numerals for phone/fax */
    .tnum { font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .fade-up { animation: fadeUp .5s ease-out both; }
    @media print {
      @page { size: 90mm 54mm; margin: 0; }
      html, body {
        background: #fff !important; background-image: none !important;
        margin: 0 !important; padding: 0 !important;
        min-height: 0 !important;
      }
      .no-print, figcaption { display: none !important; }
      /* outer 컨테이너 reset */
      body > div, body > div > div, header, main, footer {
        margin: 0 !important; padding: 0 !important; gap: 0 !important;
        min-height: 0 !important; max-width: none !important; width: auto !important;
        display: block !important;
      }
      /* figure를 90×54mm 페이지 크기로, 504×302px 카드를 그 안에 scale로 끼워넣음 */
      figure {
        width: 90mm !important; height: 54mm !important;
        margin: 0 !important; padding: 0 !important;
        overflow: hidden;
        display: block !important;
        page-break-after: always; break-after: page;
      }
      figure:last-of-type { page-break-after: auto; break-after: auto; }
      .card-screen, .fade-up { animation: none !important; }
      .card-screen {
        width: 504px !important; height: 302px !important;
        box-shadow: none !important; border-radius: 0 !important;
        margin: 0 !important; padding: 0 !important;
        /* 504px → 90mm(340px @ 96DPI): scale 0.6749. 302px → 54mm(204px): scale 0.6758. 평균 0.675 */
        transform: scale(0.6754) !important;
        transform-origin: top left !important;
      }
    }
  </style>
</head>
<body class="text-ink">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useMemo } = React;

    // ========================================
    // 🎨 Design System
    // ========================================
    const cn = (...a) => a.filter(Boolean).join(' ');

    function Button({ variant = 'primary', size = 'md', className = '', children, ...props }) {
      const base = 'inline-flex items-center justify-center gap-2 rounded-full font-medium transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-crimson/40 disabled:opacity-50';
      const variants = {
        primary: 'bg-ink text-paper hover:bg-crimson',
        ghost:   'bg-transparent text-ink hover:bg-ink/5 border border-ink/15',
      };
      const sizes = { sm: 'h-8 px-3 text-xs', md: 'h-10 px-4 text-sm', lg: 'h-12 px-6 text-base' };
      return <button className={cn(base, variants[variant], sizes[size], className)} {...props}>{children}</button>;
    }

    // Caduceus mark — uses the original transparent logo PNG from /resource
    function CaduceusMark({ className = 'h-12 w-12' }) {
      return (
        <img
          src="./resource/transparentLOGO.png"
          alt="우진산업 로고"
          className={cn('object-contain', className)}
          draggable="false"
        />
      );
    }

    // QR code rendered via api.qrserver.com (PNG)
    // The URL is a public GET endpoint that returns a QR image — no auth, no fetch logic needed.
    function QRCode({ value, size = 110, className = '' }) {
      const src = `https://api.qrserver.com/v1/create-qr-code/?size=${size*2}x${size*2}&margin=0&qzone=1&data=${encodeURIComponent(value)}`;
      return (
        <div className={cn('inline-flex items-center justify-center bg-white p-1.5 rounded-sm border border-ink/10', className)}>
          <img
            src={src}
            width={size}
            height={size}
            alt={`QR code · ${value}`}
            className="block"
            draggable="false"
          />
        </div>
      );
    }

    // ========================================
    // 📄 Card: FRONT
    // 구조:
    //   [상단]  [로고][우진산업주식회사]   ← 같은 라인, 위쪽으로 붙임
    //           ───── 빨간 가로 룰 ─────
    //   [중앙]            대표이사  김 기 영   ← '김기영'만 20% ↑
    //   [하단]  [QR | wjind.co.kr]   [본사 | 공장]   ← QR 좌측, 주소 2열 우측
    // ========================================
    function CardFront({ dark = false }) {
      const bg = dark ? 'bg-black paper-grain-dark text-paper' : 'bg-paper paper-grain text-ink';
      const t  = dark ? 'text-paper' : 'text-ink';
      const t90 = dark ? 'text-paper/90' : 'text-ink/90';
      const t55 = dark ? 'text-paper/55' : 'text-ink/55';
      return (
        <div className={cn('card-screen fade-up', bg)}>
          <div className="absolute inset-0 px-7 pt-4 pb-5 flex flex-col">
            {/* HEADER: 로고 + 회사명을 하나의 묶음으로, 좌우 여백 정확히 동일하게 중앙 정렬
                  - ml-[0.5em]: 로고와 '우' 사이 간격 = 글자 자간과 동일
                  - tracking-[0.5em]: 글자 사이 간격
                  - -mr-[0.5em]: tracking이 마지막 '사' 뒤에 만드는 trailing 0.5em을 음수 margin으로 상쇄
                                  → 박스 우측 edge가 '사'의 시각 우측 edge와 일치 → justify-center가 정확히 균형  */}
            <div className="flex items-center justify-center">
              <CaduceusMark className="h-11 w-11 flex-none" />
              <span className={cn('font-kserif text-[29px] leading-[1] font-bold ml-[0.5em] tracking-[0.5em] -mr-[0.5em]', t)}>
                우진산업주식회사
              </span>
            </div>
            {/* 빨간 가로 룰 — 헤더 바로 아래 */}
            <div style={{ marginTop: '8px', height: '3px', width: '100%', backgroundColor: '#EC4546', display: 'block' }} />

            {/* TAGLINE — 빨간줄 바로 아래, 회색 10.5px */}
            <div className={cn('mt-2 text-center text-[10.5px] tracking-[0.04em] font-medium', t55)}>
              제지화학 첨가원료 전문기업 · Since 1965
            </div>

            {/* CENTER: 대표이사 김 기 영 + 전화번호 — 모두 +20% / 카드 중앙정렬 */}
            <div className={cn('mt-4 flex flex-col items-center font-kserif', t)}>
              {/* CEO 라인이 컨테이너 폭을 결정 → 아래 번호는 같은 폭에서 양끝정렬로 자동 균등 */}
              <div style={{ width: 'max-content' }}>
                <div className="flex items-center">
                  <span className="text-[15.6px] font-medium tracking-[0.04em]">대표이사</span>
                  <span className="ml-3 text-[18.7px] font-semibold tracking-[0.55em] pr-[0.55em]">김 기 영</span>
                </div>
                {/* 전화번호 — 위 라인과 동일 폭, 각 문자를 균등 분포 */}
                <div className={cn('mt-1.5 flex w-full justify-between text-[13.2px] font-medium tnum', t90)}>
                  {[...'010-9127-7242'].map((c, i) => (
                    <span key={i}>{c}</span>
                  ))}
                </div>
              </div>
            </div>

            {/* BOTTOM: QR (좌) + 본사·공장 (우) — items-end로 밑단 일직선 정렬, 텍스트 +15% */}
            <div className="mt-auto flex items-end justify-between gap-5">
              {/* QR — 아래 왼쪽 (캡션은 QR 폭 기준 중앙 정렬) */}
              <div className="flex flex-col items-center gap-1.5">
                <QRCode value="https://dice1211.duckdns.org" size={80} />
                <div className={cn('text-[9px] tracking-[0.22em] uppercase', t55)}>
                  wjind.co.kr
                </div>
              </div>

              {/* 본사 / 공장 — 아래 오른쪽 (2열), 9px → 10.5px (+15%) */}
              <div className={cn('grid grid-cols-2 gap-x-6 text-[10.5px] leading-[1.55]', t)}>
                <div>
                  <div className={cn('font-semibold mb-1', t)}>본사 :</div>
                  <div>서울특별시 서초구</div>
                  <div>반포대로 28길 91</div>
                  <div>대진빌딩 501호</div>
                  <div className="tnum mt-1.5">전화 : (02)588-0147</div>
                  <div className="tnum">팩스 : (02)588-6599</div>
                </div>
                <div>
                  <div className={cn('font-semibold mb-1', t)}>공장 :</div>
                  <div>전북 군산시</div>
                  <div>자유로 233-109</div>
                  <div className="tnum mt-1.5">전화 : (063)467-0831</div>
                  <div className="tnum">팩스 : (063)467-0833</div>
                  <div className="tnum">이메일 : kykim@wjind.co.kr</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // 📄 Card: BACK — 앞면과 동일한 레이아웃의 영문 미러
    // 명함2.jpg 참고: WOOJIN IND., CO., LTD. / C.E.O James KY Kim / HEAD OFFICE / FACTORY
    // ========================================
    function CardBack({ dark = false }) {
      const bg = dark ? 'bg-black paper-grain-dark text-paper' : 'bg-paper paper-grain text-ink';
      const t  = dark ? 'text-paper' : 'text-ink';
      const t90 = dark ? 'text-paper/90' : 'text-ink/90';
      const t55 = dark ? 'text-paper/55' : 'text-ink/55';
      return (
        <div className={cn('card-screen fade-up', bg)}>
          <div className="absolute inset-0 px-7 pt-4 pb-5 flex flex-col">
            {/* HEADER + 빨간 가로 룰을 border-bottom으로 통합 — 어떤 layout 상황에서도 100% 렌더 */}
            <div style={{ paddingBottom: '8px', borderBottom: '3px solid #EC4546' }}>
              <div className="flex items-center justify-center">
                <CaduceusMark className="h-11 w-11 flex-none" />
                <span className={cn('font-sans text-[26px] leading-[1] font-bold ml-[0.5em] tracking-[0.06em] -mr-[0.06em]', t)}>
                  WOOJIN IND., CO., LTD.
                </span>
              </div>
            </div>

            {/* TAGLINE — 빨간줄 바로 아래, 회색 10.5px (영문 버전) */}
            <div className={cn('mt-2 text-center text-[10.5px] tracking-[0.04em] font-medium', t55)}>
              Leading Paper Chemicals · Since 1965
            </div>

            {/* CENTER: C.E.O James KY Kim + 전화번호 — 앞면 +20% 규격 동일 (Inter sans) */}
            <div className={cn('mt-4 flex flex-col items-center font-sans', t)}>
              <div style={{ width: 'max-content' }}>
                <div className="flex items-baseline">
                  <span className="text-[15.6px] font-medium tracking-[0.06em]">C.E.O</span>
                  <span className="ml-3 text-[18.7px] font-semibold tracking-[0.02em]">James KY Kim</span>
                </div>
                {/* 전화번호 — 위 라인 폭에 맞춰 균등 분포 (앞면과 동일) */}
                <div className={cn('mt-1.5 flex w-full justify-between text-[13.2px] font-medium tnum', t90)}>
                  {[...'010-9127-7242'].map((c, i) => (
                    <span key={i}>{c}</span>
                  ))}
                </div>
              </div>
            </div>

            {/* BOTTOM: QR (좌) + HEAD OFFICE · FACTORY (우) — 앞면과 동일 구조 */}
            <div className="mt-auto flex items-end justify-between gap-5">
              {/* QR — 캡션은 QR 폭 기준 중앙 정렬 */}
              <div className="flex flex-col items-center gap-1.5">
                <QRCode value="https://dice1211.duckdns.org" size={80} />
                <div className={cn('text-[9px] tracking-[0.22em] uppercase', t55)}>
                  wjind.co.kr
                </div>
              </div>

              {/* HQ / FACTORY — 짧은 라벨 (T·F·E)
                  HQ는 줄 수가 1줄 적어 self-end로 그리드 row 바닥에 정렬 → FACTORY·QR 캡션과 밑단 일직선 */}
              <div className={cn('grid grid-cols-2 gap-x-6 text-[10.5px] leading-[1.55] items-end', t)}>
                <div className="self-end pl-3">
                  <div className={cn('font-semibold mb-1', t)}>HQ :</div>
                  <div>#501, Daejin Bldg,</div>
                  <div>91 Banpo-daero 28-gil,</div>
                  <div>Seocho-gu, Seoul, Korea</div>
                  <div className="tnum mt-1.5">T : (02)588-0147</div>
                  <div className="tnum">F : (02)588-6599</div>
                </div>
                <div>
                  <div className={cn('font-semibold mb-1', t)}>PLANT :</div>
                  <div>233-109, Jayu-ro, Gunsan-si</div>
                  <div>Jeollabuk-do, Korea</div>
                  <div className="tnum mt-1.5">T : (063)467-0831</div>
                  <div className="tnum">F : (063)467-0833</div>
                  <div className="tnum">E : kykim@wjind.co.kr</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========================================
    // 🚀 App
    // ========================================
    function App() {
      const [view, setView] = useState('both'); // 'front' | 'back' | 'both'

      return (
        <div className="min-h-screen flex flex-col items-center px-4 py-10 md:py-14">
          {/* Header / concept line */}
          <header className="w-full max-w-5xl text-center no-print">
            <div className="text-[11px] tracking-[0.32em] text-ink/50 uppercase font-medium">
              Quest 1 · Name Card
            </div>
            <h1 className="mt-2 font-display text-3xl md:text-4xl font-medium tracking-[-0.02em] text-ink">
              나를 한 단어로 정의하면 <span className="italic text-crimson">Heritage</span>.
            </h1>
            <p className="mt-3 text-sm md:text-[15px] text-ink/65 max-w-2xl mx-auto leading-relaxed">
              60년 산업 정밀화학의 무게감을, 한 장의 90×54mm에. Fraunces &amp; Inter 두 폰트, 종이·먹·크림슨 세 가지 색.
            </p>

            {/* View toggle */}
            <div className="mt-6 inline-flex items-center gap-2 rounded-full bg-paper/70 backdrop-blur p-1 border border-ink/10">
              {[
                { id: 'both',  label: '앞 + 뒤' },
                { id: 'front', label: '앞면' },
                { id: 'back',  label: '뒷면' },
              ].map(o => (
                <button
                  key={o.id}
                  onClick={() => setView(o.id)}
                  className={cn(
                    'h-9 px-4 text-xs font-medium rounded-full transition-colors',
                    view === o.id ? 'bg-ink text-paper' : 'text-ink/65 hover:text-ink'
                  )}
                >
                  {o.label}
                </button>
              ))}
              <button
                onClick={() => window.print()}
                className="h-9 px-4 text-xs font-medium rounded-full text-ink/65 hover:text-ink transition-colors"
                title="PDF로 출력"
              >
                Print / PDF
              </button>
            </div>
          </header>

          {/* Cards */}
          <main className={cn(
            'mt-10 w-full max-w-5xl flex flex-wrap items-start justify-center gap-10',
            view === 'both' ? 'md:gap-14' : ''
          )}>
            {(view === 'both' || view === 'front') && (
              <figure className="flex flex-col items-center gap-3">
                <CardFront />
                <figcaption className="text-[10px] tracking-[0.28em] text-ink/45 uppercase no-print">Front · 앞면</figcaption>
              </figure>
            )}
            {(view === 'both' || view === 'back') && (
              <figure className="flex flex-col items-center gap-3">
                <CardBack />
                <figcaption className="text-[10px] tracking-[0.28em] text-ink/45 uppercase no-print">Back · 뒷면</figcaption>
              </figure>
            )}
            {(view === 'both' || view === 'front') && (
              <figure className="flex flex-col items-center gap-3">
                <CardFront dark />
                <figcaption className="text-[10px] tracking-[0.28em] text-ink/45 uppercase no-print">Front · 앞면 (Black)</figcaption>
              </figure>
            )}
            {(view === 'both' || view === 'back') && (
              <figure className="flex flex-col items-center gap-3">
                <CardBack dark />
                <figcaption className="text-[10px] tracking-[0.28em] text-ink/45 uppercase no-print">Back · 뒷면 (Black)</figcaption>
              </figure>
            )}
          </main>

          {/* Spec footnote */}
          <footer className="mt-14 max-w-3xl text-center text-[11px] leading-relaxed text-ink/45 no-print">
            <div className="font-medium text-ink/70 tracking-[0.16em] uppercase mb-2">Specification</div>
            <div>표준 명함 90 × 54 mm · 양면 · Fraunces + Inter (한글: Noto Serif KR + Noto Sans KR)</div>
            <div>컬러 3종 — Paper #FAFAF7 · Ink #1A1A1A · Crimson #EC4546 (로고에서 추출) · 강조 1개소 (대표 이름)</div>
            <div className="mt-2">QR → <a href="https://wjind.co.kr" className="underline hover:text-crimson">wjind.co.kr</a></div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
