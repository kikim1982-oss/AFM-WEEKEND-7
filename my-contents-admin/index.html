<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* Subtle scrollbar tweak to match shadcn feel */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    /* Loading shimmer */
    @keyframes shimmer {
      0% { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, #f4f4f5 0px, #e4e4e7 200px, #f4f4f5 400px);
      background-size: 800px 100%;
      animation: shimmer 1.4s infinite linear;
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900">
  <div id="root"></div>
  <script type="text/babel">
    // ========================================
    // React Hooks
    // ========================================
    const { useState, useEffect, useContext, createContext, useMemo, useCallback, useRef } = React;

    // ========================================
    // Constants & Helpers
    // ========================================
    const API_BASE_URL = '/api';
    const TOKEN_KEY = 'admin_token';

    function getToken() {
      try { return localStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
    }
    function setToken(t) {
      try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    }
    function clearToken() { setToken(null); }

    function formatKRW(n) {
      const num = Number(n || 0);
      return '₩' + num.toLocaleString('ko-KR');
    }
    function formatNumber(n) {
      return Number(n || 0).toLocaleString('ko-KR');
    }
    function formatDateTime(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '-';
      const pad = (x) => String(x).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function formatDate(iso) {
      if (!iso) return '-';
      const d = new Date(iso);
      if (isNaN(d.getTime())) return '-';
      const pad = (x) => String(x).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    function truncate(str, len = 12) {
      if (!str) return '-';
      const s = String(str);
      return s.length <= len ? s : s.slice(0, len) + '…';
    }
    function classNames(...arr) {
      return arr.filter(Boolean).join(' ');
    }

    // ========================================
    // API client
    // ========================================
    async function api(path, opts = {}) {
      const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      const token = getToken();
      if (token) headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(`${API_BASE_URL}${path}`, Object.assign({}, opts, { headers }));
      let body = null;
      try { body = await res.json(); } catch (e) { body = null; }
      if (!res.ok) {
        const err = new Error((body && body.error) || `HTTP ${res.status}`);
        err.status = res.status;
        err.body = body;
        throw err;
      }
      return body;
    }

    // ========================================
    // Auth Context
    // ========================================
    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [user, setUser] = useState(null);
      const [booting, setBooting] = useState(true);
      const [error, setError] = useState(null);

      useEffect(() => {
        let cancelled = false;
        async function boot() {
          const token = getToken();
          if (!token) {
            if (!cancelled) setBooting(false);
            return;
          }
          try {
            const data = await api('/auth/me');
            if (cancelled) return;
            if (data && data.isAdmin && data.user) {
              setUser(data.user);
            } else {
              clearToken();
              setUser(null);
            }
          } catch (e) {
            if (e.status === 401 || e.status === 403) clearToken();
            if (!cancelled) setUser(null);
          } finally {
            if (!cancelled) setBooting(false);
          }
        }
        boot();
        return () => { cancelled = true; };
      }, []);

      const login = useCallback(async (email, password) => {
        setError(null);
        const data = await api('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });
        if (!data || !data.token) {
          throw new Error('로그인에 실패했습니다');
        }
        if (!data.isAdmin) {
          clearToken();
          throw new Error('관리자 권한이 없는 계정입니다');
        }
        setToken(data.token);
        setUser(data.user);
        return data;
      }, []);

      const logout = useCallback(() => {
        clearToken();
        setUser(null);
        window.location.hash = '#/login';
      }, []);

      return (
        <AuthContext.Provider value={{ user, booting, error, login, logout }}>
          {children}
        </AuthContext.Provider>
      );
    }
    function useAuth() { return useContext(AuthContext); }

    // ========================================
    // Router (hash-based)
    // ========================================
    const RouterContext = createContext(null);

    function getCurrentPath() {
      const h = window.location.hash || '#/';
      return h.startsWith('#') ? h.slice(1) : h;
    }

    function Router({ children }) {
      const [path, setPath] = useState(getCurrentPath());
      useEffect(() => {
        const onHash = () => setPath(getCurrentPath());
        window.addEventListener('hashchange', onHash);
        if (!window.location.hash) window.location.hash = '#/';
        return () => window.removeEventListener('hashchange', onHash);
      }, []);
      const navigate = useCallback((to) => {
        if (!to) return;
        const target = to.startsWith('#') ? to : `#${to}`;
        if (window.location.hash !== target) window.location.hash = target;
      }, []);
      return (
        <RouterContext.Provider value={{ path, navigate }}>
          {children}
        </RouterContext.Provider>
      );
    }
    function useRouter() { return useContext(RouterContext); }

    function Link({ to, className, children, ...rest }) {
      const { navigate } = useRouter();
      const onClick = (e) => { e.preventDefault(); navigate(to); };
      return <a href={`#${to}`} className={className} onClick={onClick} {...rest}>{children}</a>;
    }

    // ========================================
    // Design System — shadcn-style primitives
    // ========================================

    // -- Button
    function Button({
      variant = 'default',
      size = 'default',
      className = '',
      disabled,
      children,
      type = 'button',
      ...rest
    }) {
      const base = 'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-400 disabled:pointer-events-none disabled:opacity-50';
      const variants = {
        default: 'bg-zinc-900 text-zinc-50 hover:bg-zinc-800 shadow-sm',
        destructive: 'bg-red-600 text-white hover:bg-red-700 shadow-sm',
        outline: 'border border-zinc-200 bg-white text-zinc-900 hover:bg-zinc-50 shadow-sm',
        secondary: 'bg-zinc-100 text-zinc-900 hover:bg-zinc-200',
        ghost: 'text-zinc-900 hover:bg-zinc-100',
        link: 'text-zinc-900 underline-offset-4 hover:underline',
      };
      const sizes = {
        default: 'h-9 px-4 py-2',
        sm: 'h-8 px-3 text-xs',
        lg: 'h-10 px-6',
        icon: 'h-9 w-9',
      };
      return (
        <button
          type={type}
          disabled={disabled}
          className={classNames(base, variants[variant] || variants.default, sizes[size] || sizes.default, className)}
          {...rest}
        >
          {children}
        </button>
      );
    }

    // -- Card
    function Card({ className = '', children, ...rest }) {
      return (
        <div className={classNames('rounded-lg border border-zinc-200 bg-white text-zinc-900 shadow-sm', className)} {...rest}>
          {children}
        </div>
      );
    }
    function CardHeader({ className = '', children }) {
      return <div className={classNames('flex flex-col space-y-1.5 p-6', className)}>{children}</div>;
    }
    function CardTitle({ className = '', children }) {
      return <h3 className={classNames('text-base font-semibold leading-none tracking-tight', className)}>{children}</h3>;
    }
    function CardDescription({ className = '', children }) {
      return <p className={classNames('text-sm text-zinc-500', className)}>{children}</p>;
    }
    function CardContent({ className = '', children }) {
      return <div className={classNames('p-6 pt-0', className)}>{children}</div>;
    }
    function CardFooter({ className = '', children }) {
      return <div className={classNames('flex items-center p-6 pt-0', className)}>{children}</div>;
    }

    // -- Badge
    function Badge({ variant = 'default', className = '', children }) {
      const base = 'inline-flex items-center rounded-md border px-2 py-0.5 text-xs font-medium transition-colors';
      const variants = {
        default: 'border-transparent bg-zinc-900 text-zinc-50',
        secondary: 'border-transparent bg-zinc-100 text-zinc-900',
        destructive: 'border-transparent bg-red-100 text-red-700',
        outline: 'border-zinc-200 text-zinc-900',
      };
      return <span className={classNames(base, variants[variant] || variants.default, className)}>{children}</span>;
    }

    // -- Input + Label
    function Input({ className = '', ...rest }) {
      return (
        <input
          className={classNames(
            'flex h-9 w-full rounded-md border border-zinc-200 bg-white px-3 py-1 text-sm shadow-sm transition-colors',
            'placeholder:text-zinc-400 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-400',
            'disabled:cursor-not-allowed disabled:opacity-50',
            className
          )}
          {...rest}
        />
      );
    }
    function Label({ className = '', children, htmlFor }) {
      return (
        <label htmlFor={htmlFor} className={classNames('text-sm font-medium leading-none text-zinc-900', className)}>
          {children}
        </label>
      );
    }

    // -- Table
    function Table({ className = '', children }) {
      return (
        <div className="relative w-full overflow-auto">
          <table className={classNames('w-full caption-bottom text-sm', className)}>{children}</table>
        </div>
      );
    }
    function THead({ className = '', children }) {
      return <thead className={classNames('[&_tr]:border-b border-zinc-200 bg-zinc-50/60 sticky top-0', className)}>{children}</thead>;
    }
    function TBody({ className = '', children }) {
      return <tbody className={classNames('[&_tr:last-child]:border-0', className)}>{children}</tbody>;
    }
    function TR({ className = '', children, ...rest }) {
      return <tr className={classNames('border-b border-zinc-200 transition-colors hover:bg-zinc-50', className)} {...rest}>{children}</tr>;
    }
    function TH({ className = '', children, ...rest }) {
      return <th className={classNames('h-10 px-4 text-left align-middle font-medium text-zinc-500 text-xs uppercase tracking-wide', className)} {...rest}>{children}</th>;
    }
    function TD({ className = '', children, ...rest }) {
      return <td className={classNames('p-4 align-middle', className)} {...rest}>{children}</td>;
    }

    // -- Tabs (manual implementation)
    function Tabs({ value, onChange, children, className = '' }) {
      return (
        <div className={className} data-tabs-value={value}>
          {React.Children.map(children, (child) => {
            if (!React.isValidElement(child)) return child;
            return React.cloneElement(child, { __tabsValue: value, __tabsOnChange: onChange });
          })}
        </div>
      );
    }
    function TabsList({ children, __tabsValue, __tabsOnChange, className = '' }) {
      return (
        <div role="tablist" className={classNames('inline-flex h-9 items-center justify-center rounded-lg bg-zinc-100 p-1 text-zinc-500', className)}>
          {React.Children.map(children, (child) => {
            if (!React.isValidElement(child)) return child;
            return React.cloneElement(child, { __tabsValue, __tabsOnChange });
          })}
        </div>
      );
    }
    function TabsTrigger({ value, children, __tabsValue, __tabsOnChange, className = '' }) {
      const active = __tabsValue === value;
      return (
        <button
          type="button"
          role="tab"
          aria-selected={active}
          onClick={() => __tabsOnChange && __tabsOnChange(value)}
          className={classNames(
            'inline-flex items-center justify-center whitespace-nowrap rounded-md px-3 py-1 text-sm font-medium transition-all focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-zinc-400',
            active ? 'bg-white text-zinc-900 shadow-sm' : 'hover:text-zinc-900',
            className
          )}
        >
          {children}
        </button>
      );
    }

    // -- Skeleton rows
    function SkeletonRows({ rows = 6, cols = 4 }) {
      return (
        <div className="space-y-2 p-4">
          {Array.from({ length: rows }).map((_, i) => (
            <div key={i} className="flex gap-4">
              {Array.from({ length: cols }).map((__, j) => (
                <div key={j} className="skeleton h-4 rounded flex-1" />
              ))}
            </div>
          ))}
        </div>
      );
    }

    // -- Banner
    function Banner({ variant = 'error', children, className = '' }) {
      const variants = {
        error: 'border-red-200 bg-red-50 text-red-700',
        warning: 'border-amber-200 bg-amber-50 text-amber-800',
        info: 'border-zinc-200 bg-zinc-50 text-zinc-700',
        success: 'border-emerald-200 bg-emerald-50 text-emerald-700',
      };
      return (
        <div className={classNames('rounded-md border px-4 py-3 text-sm', variants[variant] || variants.info, className)}>
          {children}
        </div>
      );
    }

    // -- Empty State
    function EmptyState({ message = '표시할 데이터가 없습니다' }) {
      return (
        <div className="flex flex-col items-center justify-center py-16 text-sm text-zinc-500">
          <svg className="h-10 w-10 mb-3 text-zinc-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M9 17v-6h13v6M5 7h14v10H5z" />
          </svg>
          {message}
        </div>
      );
    }

    // -- Pagination
    function Pagination({ total, limit, offset, onChange }) {
      const totalPages = Math.max(1, Math.ceil((total || 0) / limit));
      const currentPage = Math.floor(offset / limit) + 1;
      const goto = (p) => {
        const clamped = Math.min(totalPages, Math.max(1, p));
        onChange((clamped - 1) * limit);
      };
      return (
        <div className="flex items-center justify-between gap-3 px-4 py-3 border-t border-zinc-200">
          <div className="text-sm text-zinc-500">
            총 <span className="font-medium text-zinc-900">{formatNumber(total || 0)}</span>건 · {currentPage} / {totalPages} 페이지
          </div>
          <div className="flex items-center gap-1">
            <Button variant="outline" size="sm" disabled={currentPage <= 1} onClick={() => goto(1)}>처음</Button>
            <Button variant="outline" size="sm" disabled={currentPage <= 1} onClick={() => goto(currentPage - 1)}>이전</Button>
            <Button variant="outline" size="sm" disabled={currentPage >= totalPages} onClick={() => goto(currentPage + 1)}>다음</Button>
            <Button variant="outline" size="sm" disabled={currentPage >= totalPages} onClick={() => goto(totalPages)}>끝</Button>
          </div>
        </div>
      );
    }

    // -- Status Badge helper
    function StatusBadge({ status }) {
      const s = String(status || '').toUpperCase();
      if (s === 'PAID') return <Badge variant="default">PAID</Badge>;
      if (s === 'PENDING') return <Badge variant="secondary">PENDING</Badge>;
      if (s === 'FAILED' || s === 'CANCELED' || s === 'CANCELLED') return <Badge variant="destructive">{s}</Badge>;
      return <Badge variant="outline">{s || '-'}</Badge>;
    }

    // ========================================
    // useApi hook (auth-aware)
    // ========================================
    function useApi(path, deps = []) {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const { logout } = useAuth();
      const reload = useCallback(async () => {
        setLoading(true);
        setError(null);
        try {
          const d = await api(path);
          setData(d);
        } catch (e) {
          if (e.status === 401) {
            clearToken();
            logout();
            return;
          }
          setError(e);
        } finally {
          setLoading(false);
        }
      }, [path]); // eslint-disable-line
      useEffect(() => {
        let cancelled = false;
        (async () => {
          setLoading(true);
          setError(null);
          try {
            const d = await api(path);
            if (!cancelled) setData(d);
          } catch (e) {
            if (cancelled) return;
            if (e.status === 401) {
              clearToken();
              logout();
              return;
            }
            setError(e);
          } finally {
            if (!cancelled) setLoading(false);
          }
        })();
        return () => { cancelled = true; };
        // eslint-disable-next-line
      }, deps);
      return { data, loading, error, reload };
    }

    // ========================================
    // Layout components
    // ========================================
    function TopBar() {
      const { user, logout } = useAuth();
      return (
        <header className="sticky top-0 z-30 h-14 border-b border-zinc-200 bg-white">
          <div className="h-full px-6 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <div className="h-7 w-7 rounded-md bg-zinc-900 text-white flex items-center justify-center text-xs font-bold">PX</div>
              <Link to="/" className="text-base font-semibold tracking-tight">Pixel Admin</Link>
              <Badge variant="outline" className="ml-2 text-[10px]">ADMIN</Badge>
            </div>
            <div className="flex items-center gap-3">
              {user && (
                <span className="text-sm text-zinc-500 hidden sm:inline">
                  {user.email}
                </span>
              )}
              <Button variant="outline" size="sm" onClick={logout}>로그아웃</Button>
            </div>
          </div>
        </header>
      );
    }

    function Sidebar() {
      const { path } = useRouter();
      const items = [
        { to: '/', label: '대시보드', match: (p) => p === '/' || p === '' },
        { to: '/users', label: '사용자', match: (p) => p.startsWith('/users') },
        { to: '/orders', label: '주문', match: (p) => p.startsWith('/orders') },
        { to: '/products', label: '상품', match: (p) => p.startsWith('/products') },
      ];
      return (
        <aside className="w-56 shrink-0 border-r border-zinc-200 bg-white min-h-[calc(100vh-3.5rem)] sticky top-14">
          <nav className="p-3 space-y-1">
            {items.map((it) => {
              const active = it.match(path);
              return (
                <Link
                  key={it.to}
                  to={it.to}
                  className={classNames(
                    'block rounded-md px-3 py-2 text-sm font-medium transition-colors',
                    active ? 'bg-zinc-100 text-zinc-900' : 'text-zinc-600 hover:bg-zinc-50 hover:text-zinc-900'
                  )}
                >
                  {it.label}
                </Link>
              );
            })}
          </nav>
          <div className="px-5 py-4 text-[11px] text-zinc-400 border-t border-zinc-100 mt-2">
            v1.0 · Pixel Store Admin
          </div>
        </aside>
      );
    }

    function ContentShell({ title, description, actions, children }) {
      return (
        <div className="flex-1 min-w-0">
          <div className="px-6 py-6 max-w-6xl mx-auto">
            <div className="mb-6 flex items-end justify-between gap-4">
              <div>
                <h1 className="text-2xl font-semibold tracking-tight">{title}</h1>
                {description && <p className="text-sm text-zinc-500 mt-1">{description}</p>}
              </div>
              {actions}
            </div>
            {children}
          </div>
        </div>
      );
    }

    // ========================================
    // Page: Login
    // ========================================
    function LoginPage() {
      const { login } = useAuth();
      const { navigate } = useRouter();
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [submitting, setSubmitting] = useState(false);
      const [err, setErr] = useState(null);

      const onSubmit = async (e) => {
        e.preventDefault();
        setErr(null);
        setSubmitting(true);
        try {
          await login(email.trim(), password);
          navigate('/');
        } catch (ex) {
          setErr(ex.message || '로그인에 실패했습니다');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <div className="min-h-screen bg-zinc-50 flex items-center justify-center px-4">
          <Card className="w-full max-w-sm">
            <CardHeader>
              <div className="flex items-center gap-2 mb-2">
                <div className="h-7 w-7 rounded-md bg-zinc-900 text-white flex items-center justify-center text-xs font-bold">PX</div>
                <span className="text-base font-semibold">Pixel Admin</span>
              </div>
              <CardTitle>관리자 로그인</CardTitle>
              <CardDescription>관리자 계정으로 로그인하세요.</CardDescription>
            </CardHeader>
            <CardContent>
              <form onSubmit={onSubmit} className="space-y-4">
                <div className="space-y-2">
                  <Label htmlFor="email">이메일</Label>
                  <Input
                    id="email"
                    type="email"
                    autoComplete="email"
                    placeholder="admin@example.com"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    required
                  />
                </div>
                <div className="space-y-2">
                  <Label htmlFor="password">비밀번호</Label>
                  <Input
                    id="password"
                    type="password"
                    autoComplete="current-password"
                    placeholder="••••••••"
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    required
                  />
                </div>
                {err && <Banner variant="error">{err}</Banner>}
                <Button type="submit" className="w-full" disabled={submitting || !email || !password}>
                  {submitting ? '로그인 중…' : '로그인'}
                </Button>
              </form>
            </CardContent>
            <CardFooter>
              <p className="text-xs text-zinc-500">
                고객 페이지로 이동하려면 별도 사이트를 이용해주세요.
              </p>
            </CardFooter>
          </Card>
        </div>
      );
    }

    // ========================================
    // Page: Dashboard
    // ========================================
    function StatCard({ label, value, hint }) {
      return (
        <Card>
          <CardHeader className="pb-2">
            <CardDescription>{label}</CardDescription>
          </CardHeader>
          <CardContent>
            <div className="text-2xl font-semibold tracking-tight">{value}</div>
            {hint && <div className="text-xs text-zinc-500 mt-1">{hint}</div>}
          </CardContent>
        </Card>
      );
    }

    function DashboardPage() {
      const { data: stats, loading: statsLoading, error: statsError } = useApi('/admin/stats', []);

    // ========================================
    // ImageKit Direct Upload Helper
    // ========================================
    async function uploadToImageKit(file, onProgress) {
      const [config, auth] = await Promise.all([
        api('/admin/imagekit/config'),
        api('/admin/imagekit/auth'),
      ]);
      const form = new FormData();
      form.append('file', file);
      form.append('fileName', file.name || 'image.png');
      form.append('publicKey', config.publicKey);
      form.append('signature', auth.signature);
      form.append('expire', String(auth.expire));
      form.append('token', auth.token);
      form.append('folder', '/products');
      form.append('useUniqueFileName', 'true');

      const res = await fetch('https://upload.imagekit.io/api/v1/files/upload', {
        method: 'POST', body: form,
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || `ImageKit 업로드 실패 (HTTP ${res.status})`);
      return data; // { url, fileId, name, filePath, thumbnailUrl, ... }
    }

    // ========================================
    // Page: Product Form (등록 / 수정 공용)
    // ========================================
    function ProductFormPage({ mode, productId }) {
      const isEdit = mode === 'edit';
      const { navigate } = useRouter();

      const [loading, setLoading] = useState(isEdit);
      const [saving, setSaving] = useState(false);
      const [uploading, setUploading] = useState(false);
      const [error, setError] = useState(null);
      const [okMsg, setOkMsg] = useState(null);

      const [form, setForm] = useState({
        id: '', title: '', tagline: '', description: '',
        price: '', originalPrice: '',
        category: '', tag: '',
        imageUrl: '', imageFileId: '',
        isActive: true,
      });

      const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));

      // 수정 모드 — 기존 값 로드
      useEffect(() => {
        if (!isEdit) return;
        let cancelled = false;
        (async () => {
          try {
            const data = await api(`/admin/products/${productId}`);
            if (cancelled) return;
            const p = data.product;
            setForm({
              id: p.id, title: p.title || '', tagline: p.tagline || '',
              description: p.description || '',
              price: String(p.price ?? ''),
              originalPrice: p.originalPrice ? String(p.originalPrice) : '',
              category: p.category || '', tag: p.tag || '',
              imageUrl: p.imageUrl || '', imageFileId: p.imageFileId || '',
              isActive: !!p.isActive,
            });
          } catch (e) {
            if (!cancelled) setError(e.message || '상품을 불러오지 못했습니다.');
          } finally {
            if (!cancelled) setLoading(false);
          }
        })();
        return () => { cancelled = true; };
      }, [isEdit, productId]);

      // ID 자동 슬러그화 (등록 모드만)
      const handleTitleChange = (e) => {
        const v = e.target.value;
        setForm((f) => {
          const next = { ...f, title: v };
          if (!isEdit && !f.id) {
            // 한글은 그대로 두고 영문/숫자만 슬러그화
            const slug = v.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
            if (slug) next.id = slug;
          }
          return next;
        });
      };

      const handleFile = async (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) { setError('이미지 파일만 업로드 가능합니다.'); return; }
        if (file.size > 10 * 1024 * 1024) { setError('이미지 크기는 10MB 이하여야 합니다.'); return; }
        setError(null);
        setUploading(true);
        try {
          const data = await uploadToImageKit(file);
          setForm((f) => ({ ...f, imageUrl: data.url, imageFileId: data.fileId }));
          setOkMsg('이미지 업로드 완료');
          setTimeout(() => setOkMsg(null), 2000);
        } catch (err) {
          setError('ImageKit 업로드 실패: ' + err.message);
        } finally {
          setUploading(false);
          e.target.value = ''; // 같은 파일 재선택 가능하게
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setError(null);
        if (!form.imageUrl) { setError('상품 이미지를 업로드해주세요.'); return; }

        const payload = {
          id: form.id.trim(),
          title: form.title.trim(),
          tagline: form.tagline.trim() || null,
          description: form.description.trim() || null,
          price: Number(form.price),
          originalPrice: form.originalPrice ? Number(form.originalPrice) : null,
          category: form.category.trim() || null,
          tag: form.tag.trim() || null,
          imageUrl: form.imageUrl,
          imageFileId: form.imageFileId || null,
        };
        if (isEdit) payload.isActive = form.isActive;

        setSaving(true);
        try {
          if (isEdit) {
            await api(`/admin/products/${productId}`, { method: 'PUT', body: JSON.stringify(payload) });
          } else {
            await api('/admin/products', { method: 'POST', body: JSON.stringify(payload) });
          }
          navigate('/products');
        } catch (err) {
          setError(err.body?.message || err.message || '저장 실패');
        } finally {
          setSaving(false);
        }
      };

      if (loading) {
        return (
          <ContentShell title="불러오는 중…">
            <SkeletonRows rows={6} cols={2} />
          </ContentShell>
        );
      }

      return (
        <ContentShell
          title={isEdit ? '상품 수정' : '새 상품 등록'}
          description={isEdit ? form.id : '판매할 PNG 콘텐츠 정보를 입력하세요.'}
          actions={
            <Button variant="outline" onClick={() => navigate('/products')}>← 목록으로</Button>
          }
        >
          {error && <Banner variant="error" className="mb-4">{error}</Banner>}
          {okMsg && <Banner variant="success" className="mb-4">{okMsg}</Banner>}

          <form onSubmit={handleSubmit} className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* 좌측: 폼 필드 */}
            <div className="lg:col-span-2 space-y-4">
              <Card>
                <CardHeader>
                  <CardTitle>기본 정보</CardTitle>
                </CardHeader>
                <CardContent className="space-y-4">
                  <div>
                    <Label htmlFor="title">상품명 *</Label>
                    <Input id="title" value={form.title} onChange={handleTitleChange} placeholder="예: Aurora Pack" required />
                  </div>
                  <div>
                    <Label htmlFor="id">상품 ID (URL slug) *</Label>
                    <Input
                      id="id" value={form.id} onChange={set('id')}
                      placeholder="aurora-pack"
                      disabled={isEdit}
                      required
                    />
                    <p className="text-xs text-zinc-500 mt-1">영문 소문자 / 숫자 / 하이픈만. 등록 후 변경 불가.</p>
                  </div>
                  <div>
                    <Label htmlFor="tagline">한 줄 소개</Label>
                    <Input id="tagline" value={form.tagline} onChange={set('tagline')} placeholder="북유럽 오로라 일러스트" />
                  </div>
                  <div>
                    <Label htmlFor="description">상세 설명</Label>
                    <textarea
                      id="description" value={form.description} onChange={set('description')}
                      rows={4}
                      className="w-full px-3 py-2 text-sm rounded-md border border-zinc-200 bg-white focus:outline-none focus:ring-2 focus:ring-zinc-900 resize-y"
                      placeholder="상품 상세 설명…"
                    />
                  </div>
                </CardContent>
              </Card>

              <Card>
                <CardHeader>
                  <CardTitle>가격</CardTitle>
                </CardHeader>
                <CardContent className="grid grid-cols-2 gap-4">
                  <div>
                    <Label htmlFor="price">판매가 (원) *</Label>
                    <Input id="price" type="number" min="0" value={form.price} onChange={set('price')} placeholder="4900" required />
                  </div>
                  <div>
                    <Label htmlFor="originalPrice">정가 (원)</Label>
                    <Input id="originalPrice" type="number" min="0" value={form.originalPrice} onChange={set('originalPrice')} placeholder="9900" />
                    <p className="text-xs text-zinc-500 mt-1">선택. 입력하면 할인율이 자동 표시됩니다.</p>
                  </div>
                </CardContent>
              </Card>

              <Card>
                <CardHeader>
                  <CardTitle>분류</CardTitle>
                </CardHeader>
                <CardContent className="grid grid-cols-2 gap-4">
                  <div>
                    <Label htmlFor="category">카테고리</Label>
                    <Input id="category" value={form.category} onChange={set('category')} placeholder="자연 · 풍경" />
                  </div>
                  <div>
                    <Label htmlFor="tag">태그</Label>
                    <Input id="tag" value={form.tag} onChange={set('tag')} placeholder="베스트 / 신상 / 인기" />
                  </div>
                </CardContent>
              </Card>

              {isEdit && (
                <Card>
                  <CardHeader>
                    <CardTitle>공개 상태</CardTitle>
                  </CardHeader>
                  <CardContent>
                    <label className="flex items-center gap-2 text-sm">
                      <input
                        type="checkbox"
                        checked={form.isActive}
                        onChange={(e) => setForm((f) => ({ ...f, isActive: e.target.checked }))}
                        className="w-4 h-4 rounded border-zinc-300"
                      />
                      <span>스토어에 공개 (활성)</span>
                    </label>
                  </CardContent>
                </Card>
              )}
            </div>

            {/* 우측: 이미지 업로드 */}
            <div className="space-y-4">
              <Card>
                <CardHeader>
                  <CardTitle>상품 이미지</CardTitle>
                  <CardDescription>ImageKit에 업로드되어 호스팅됩니다.</CardDescription>
                </CardHeader>
                <CardContent className="space-y-3">
                  <div className="aspect-square rounded-md bg-zinc-100 overflow-hidden ring-1 ring-zinc-200 flex items-center justify-center">
                    {form.imageUrl ? (
                      <img src={form.imageUrl} alt="preview" className="w-full h-full object-cover" />
                    ) : (
                      <div className="text-center text-zinc-400 text-sm p-6">
                        이미지를 업로드해주세요
                      </div>
                    )}
                  </div>

                  <label className="block">
                    <input type="file" accept="image/*" onChange={handleFile} disabled={uploading} className="hidden" />
                    <span className={`block w-full text-center text-sm px-4 py-2.5 rounded-md border font-medium cursor-pointer transition
                      ${uploading
                        ? 'bg-zinc-100 border-zinc-200 text-zinc-400 cursor-wait'
                        : 'bg-white border-zinc-300 hover:bg-zinc-50 text-zinc-900'}`}>
                      {uploading ? '업로드 중…' : (form.imageUrl ? '다른 이미지로 교체' : '이미지 업로드')}
                    </span>
                  </label>

                  {form.imageUrl && (
                    <div className="text-[10px] text-zinc-400 break-all">
                      <div>URL: {form.imageUrl}</div>
                      {form.imageFileId && <div>fileId: {form.imageFileId}</div>}
                    </div>
                  )}
                </CardContent>
              </Card>

              <Card>
                <CardContent className="pt-6 space-y-3">
                  <Button type="submit" className="w-full" disabled={saving || uploading}>
                    {saving ? '저장 중…' : (isEdit ? '변경 사항 저장' : '상품 등록')}
                  </Button>
                  <Button type="button" variant="outline" className="w-full" onClick={() => navigate('/products')} disabled={saving}>
                    취소
                  </Button>
                </CardContent>
              </Card>
            </div>
          </form>
        </ContentShell>
      );
    }

    // ========================================
    // App Shell + Routing
    // ========================================
    function ProtectedShell() {
      const { user } = useAuth();
      const { path, navigate } = useRouter();

      useEffect(() => {
        if (!user) navigate('/login');
      }, [user]); // eslint-disable-line

      if (!user) return null;

      const segments = path.split('/').filter(Boolean); // /products/new → ['products', 'new']

      let page = null;
      if (path === '/' || path === '') page = <DashboardPage />;
      else if (segments[0] === 'users') page = <UsersPage />;
      else if (segments[0] === 'orders') page = <OrdersPage />;
      else if (segments[0] === 'products') {
        if (segments[1] === 'new') page = <ProductFormPage mode="create" />;
        else if (segments[1] && segments[2] === 'edit') page = <ProductFormPage mode="edit" productId={segments[1]} />;
        else page = <ProductsPage />;
      }
      else page = (
        <ContentShell title="페이지를 찾을 수 없습니다">
          <Card>
            <CardContent className="py-10 text-center text-sm text-zinc-500">
              <p className="mb-4">요청하신 경로가 존재하지 않습니다: <span className="font-mono">{path}</span></p>
              <Button onClick={() => navigate('/')}>대시보드로 이동</Button>
            </CardContent>
          </Card>
        </ContentShell>
      );

      return (
        <div className="min-h-screen bg-zinc-50">
          <TopBar />
          <div className="flex">
            <Sidebar />
            {page}
          </div>
        </div>
      );
    }

    function AppRoutes() {
      const { user, booting } = useAuth();
      const { path, navigate } = useRouter();

      useEffect(() => {
        if (booting) return;
        if (user && path === '/login') navigate('/');
        if (!user && path !== '/login') navigate('/login');
      }, [booting, user, path]); // eslint-disable-line

      if (booting) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-zinc-50">
            <div className="flex items-center gap-3 text-zinc-500 text-sm">
              <div className="h-4 w-4 rounded-full border-2 border-zinc-300 border-t-zinc-900 animate-spin" />
              인증 확인 중…
            </div>
          </div>
        );
      }

      if (path === '/login' || !user) return <LoginPage />;

      return <ProtectedShell />;
    }

    // ========================================
    // App Root
    // ========================================
    function App() {
      return (
        <Router>
          <AuthProvider>
            <AppRoutes />
          </AuthProvider>
        </Router>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
