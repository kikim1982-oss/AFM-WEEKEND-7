<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>결 KYUL — 일상의 결을 다듬다</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- shadcn 스타일 토큰 + Tailwind 확장 -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        container: {
          center: true,
          padding: '1rem',
          screens: {
            '2xl': '1280px',
          },
        },
        extend: {
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            popover: {
              DEFAULT: 'hsl(var(--popover))',
              foreground: 'hsl(var(--popover-foreground))',
            },
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
          },
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
          fontFamily: {
            sans: ['"Pretendard"', '"Inter"', 'system-ui', 'sans-serif'],
            serif: ['"Noto Serif KR"', 'ui-serif', 'Georgia', 'serif'],
          },
          keyframes: {
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'slide-in-right': {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(0)' },
            },
            'overlay-in': {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
          },
          animation: {
            'fade-in': 'fade-in 0.4s ease-out',
            'slide-in-right': 'slide-in-right 0.3s ease-out',

  <style>
    /* shadcn New York / Stone 무드 (따뜻한 중립톤) */
    :root {
      --background: 30 20% 99%;
      --foreground: 24 10% 10%;

      --card: 0 0% 100%;
      --card-foreground: 24 10% 10%;

      --popover: 0 0% 100%;
      --popover-foreground: 24 10% 10%;

      --primary: 24 10% 12%;
      --primary-foreground: 30 25% 98%;

      --secondary: 30 12% 95%;
      --secondary-foreground: 24 10% 12%;

      --muted: 30 12% 95%;
      --muted-foreground: 25 6% 45%;

      --accent: 30 12% 93%;
      --accent-foreground: 24 10% 12%;

      --destructive: 0 72% 51%;
      --destructive-foreground: 30 25% 98%;

      --border: 30 10% 90%;
      --input: 30 10% 90%;
      --ring: 24 10% 20%;

      --radius: 0.5rem;
    }

    .dark {
      --background: 24 10% 7%;
      --foreground: 30 20% 96%;

      --card: 24 10% 9%;
      --card-foreground: 30 20% 96%;

      --popover: 24 10% 9%;

      --primary: 30 20% 96%;
      --primary-foreground: 24 10% 12%;

      --secondary: 24 8% 16%;
      --secondary-foreground: 30 20% 96%;

      --muted: 24 8% 16%;

      --accent: 24 8% 18%;
      --accent-foreground: 30 20% 96%;

      --destructive: 0 62% 40%;
      --destructive-foreground: 30 20% 96%;

      --border: 24 8% 18%;
      --input: 24 8% 22%;
      --ring: 30 10% 75%;
    }

    * {
      border-color: hsl(var(--border));
    }

    html,
    body {
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      -webkit-font-smoothing: antialiased;
      font-feature-settings: 'cv11', 'ss01';
    }

    /* Hide default focus, use ring via tailwind */
    :focus {
      outline: none;
    }

    /* Image fallback */
    .img-fallback {
      background: linear-gradient(
        135deg,
        hsl(var(--muted)) 0%,
        hsl(var(--accent)) 100%
      );
    }

    /* Sheet overlay scroll lock helper */
    body.lock {
      overflow: hidden;
    }

<body class="font-sans">
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
    // ========================================
    // React Hooks
    // ========================================
    const {
      useState,
      useEffect,
      useMemo,
      useCallback,
      useRef,
      createContext,
      useContext,
    } = React;

    // ========================================
    // Utilities
    // ========================================
    const cn = (...args) => args.filter(Boolean).join(' ');

    const formatKRW = (n) =>
      '₩' + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

    // ========================================
    // Icons (inline SVG, lucide-style)
    // ========================================
    const Icon = ({ path, size = 18, className = '', strokeWidth = 1.75 }) => (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth={strokeWidth}
        strokeLinecap="round"
        strokeLinejoin="round"
        className={className}
        aria-hidden="true"
      >
        {path}
      </svg>
    );

    const I = {
      menu: <Icon path={<><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></>} />,
      x: (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />,
      search: (p) => <Icon {...p} path={<><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />,
      bag: (p) => <Icon {...p} path={<><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></>} />,
      sun: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></>} />,
      moon: (p) => <Icon {...p} path={<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>} />,

      instagram: (p) => <Icon {...p} path={<><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></>} />,
      youtube: (p) => <Icon {...p} path={<><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></>} />,
      pinterest: (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="M8 11.5c0-2.5 2-4.5 4.5-4.5s4.5 2 4.5 4.5c0 2.5-1.5 4.5-4 4.5-1.5 0-2.5-.75-2.5-.75M10 22l1.5-7"/></>} />,
      truck: (p) => <Icon {...p} path={<><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></>} />,

      refresh: (p) => <Icon {...p} path={<><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></>} />,
    };

    // ========================================
    // Toast (전역)
    // ========================================
    const ToastCtx = createContext(null);

    const ToastProvider = ({ children }) => {
      const [toasts, setToasts] = useState([]);
      const push = useCallback((t) => {
        const id = Math.random().toString(36).slice(2);
        setToasts((prev) => [...prev, { id, ...t }]);
        setTimeout(() => {
          setToasts((prev) => prev.filter((x) => x.id !== id));
        }, 3200);
      }, []);
      return (
        <ToastCtx.Provider value={{ push }}>
          {children}
          <div className="fixed bottom-4 right-4 z-[100] flex flex-col gap-2 max-w-sm w-[calc(100%-2rem)] sm:w-auto">
            {toasts.map((t) => (
              <div
                key={t.id}
                className="animate-fade-in pointer-events-auto rounded-md border bg-popover text-popover-foreground shadow-lg p-4 pr-6 flex items-start gap-3"
                role="status"
              >
                <div className="rounded-full bg-primary/10 text-primary p-1.5 mt-0.5">
                  {I.check({ size: 14, strokeWidth: 2.5 })}
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-medium text-sm">{t.title}</div>
                  {t.description && (
                    <div className="text-sm text-muted-foreground mt-0.5">
                      {t.description}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        </ToastCtx.Provider>
      );
    };

    const useToast = () => useContext(ToastCtx);

    // ========================================
    // Design System — shadcn 스타일
    // ========================================

    // ---- Button ----
    const buttonVariants = {
      default:
        'bg-primary text-primary-foreground hover:bg-primary/90',
      secondary:
        'bg-secondary text-secondary-foreground hover:bg-secondary/80',
      outline:
        'border border-input bg-background hover:bg-accent hover:text-accent-foreground',
      ghost: 'hover:bg-accent hover:text-accent-foreground',
      destructive:
        'bg-destructive text-destructive-foreground hover:bg-destructive/90',
      link: 'text-primary underline-offset-4 hover:underline',
    };
    const buttonSizes = {
      default: 'h-10 px-4 py-2',
      sm: 'h-9 rounded-md px-3 text-xs',
      lg: 'h-11 rounded-md px-8',
      icon: 'h-10 w-10',
    };
    const Button = React.forwardRef(
      (
        {
          className = '',
          variant = 'default',
          size = 'default',
          asChild,
          type = 'button',
          ...props
        },
        ref
      ) => (
        <button
          ref={ref}
          type={type}
          className={cn(
            'inline-flex items-center justify-center gap-2 whitespace-nowrap rounded-md text-sm font-medium transition-colors',
            'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background',
            'disabled:pointer-events-none disabled:opacity-50',
            buttonVariants[variant],
            buttonSizes[size],
            className
          )}
          {...props}
        />
      )
    );

    // ---- Card ----
    const Card = ({ className = '', ...p }) => (
      <div
        className={cn(
          'rounded-lg border bg-card text-card-foreground shadow-sm',
          className
        )}
        {...p}
      />
    );
    const CardHeader = ({ className = '', ...p }) => (
      <div className={cn('flex flex-col space-y-1.5 p-6', className)} {...p} />
    );
    const CardTitle = ({ className = '', ...p }) => (
      <h3
        className={cn(
          'text-lg font-semibold leading-none tracking-tight',
          className
        )}
        {...p}
      />
    );
    const CardDescription = ({ className = '', ...p }) => (
      <p className={cn('text-sm text-muted-foreground', className)} {...p} />
    );
    const CardContent = ({ className = '', ...p }) => (
      <div className={cn('p-6 pt-0', className)} {...p} />
    );
    const CardFooter = ({ className = '', ...p }) => (
      <div className={cn('flex items-center p-6 pt-0', className)} {...p} />
    );

    // ---- Badge ----
    const badgeVariants = {
      default:
        'border-transparent bg-primary text-primary-foreground hover:bg-primary/80',
      secondary:
        'border-transparent bg-secondary text-secondary-foreground hover:bg-secondary/80',
      destructive:
        'border-transparent bg-destructive text-destructive-foreground hover:bg-destructive/80',
      outline: 'text-foreground',
    };
    const Badge = ({ className = '', variant = 'default', ...p }) => (
      <span
        className={cn(
          'inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors',
          'focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2',
          badgeVariants[variant],
          className
        )}
        {...p}
      />
    );

    // ---- Input / Label ----
    const Input = React.forwardRef(({ className = '', type = 'text', ...p }, ref) => (
      <input
        ref={ref}
        type={type}
        className={cn(
          'flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm',
          'file:border-0 file:bg-transparent file:text-sm file:font-medium',
          'placeholder:text-muted-foreground',
          'focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 focus-visible:ring-offset-background',
          'disabled:cursor-not-allowed disabled:opacity-50',
          className
        )}
        {...p}
      />
    ));
    const Label = ({ className = '', ...p }) => (
      <label
        className={cn(
          'text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70',
          className
        )}
        {...p}
      />
    );

    // ---- Separator ----
    const Separator = ({ className = '', orientation = 'horizontal' }) => (
      <div
        role="none"
        className={cn(
          'shrink-0 bg-border',
          orientation === 'horizontal' ? 'h-px w-full' : 'h-full w-px',
          className
        )}
      />
    );

    // ---- Sheet (모바일 메뉴) ----
    const Sheet = ({ open, onOpenChange, side = 'right', children }) => {
      useEffect(() => {
        if (open) document.body.classList.add('lock');
        else document.body.classList.remove('lock');
        return () => document.body.classList.remove('lock');
      }, [open]);

      useEffect(() => {
        const onKey = (e) => {
          if (e.key === 'Escape') onOpenChange(false);
        };
        if (open) window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [open, onOpenChange]);

      if (!open) return null;
      return (
        <div className="fixed inset-0 z-50">
          <div
            className="absolute inset-0 bg-black/40 backdrop-blur-sm animate-overlay-in"
            onClick={() => onOpenChange(false)}
          />
          <div
            className={cn(
              'absolute top-0 bottom-0 w-[85%] max-w-sm bg-background border-l shadow-xl p-6 animate-slide-in-right',
              side === 'right' ? 'right-0' : 'left-0'
            )}
            role="dialog"
            aria-modal="true"
          >
            {children}
          </div>
        </div>
      );
    };

    // ---- Star Rating ----
    const StarRating = ({ rating, size = 14 }) => {
      const full = Math.floor(rating);
      const hasHalf = rating - full >= 0.5;
      return (
        <div className="inline-flex items-center gap-0.5 text-amber-500">
          {Array.from({ length: 5 }).map((_, i) => {
            const filled = i < full || (i === full && hasHalf);
            return (
              <svg
                key={i}
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width={size}
                height={size}
                fill={filled ? 'currentColor' : 'none'}
                stroke="currentColor"
                strokeWidth="1.75"
              >
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
              </svg>
            );
          })}
        </div>
      );
    };

    // ---- SafeImage (fallback gradient) ----
    const SafeImage = ({ src, alt, className = '', ...p }) => {
      const [error, setError] = useState(false);
      if (error || !src) {
        return (
          <div
            className={cn('img-fallback flex items-center justify-center', className)}
            aria-label={alt}
            role="img"
          >
            <svg
              width="48"
              height="48"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              strokeWidth="1"
              className="text-muted-foreground/40"
            >
              <rect x="3" y="3" width="18" height="18" rx="2" />
              <circle cx="8.5" cy="8.5" r="1.5" />
              <polyline points="21 15 16 10 5 21" />
            </svg>
          </div>
        );
      }
      return (
        <img
          src={src}
          alt={alt}
          loading="lazy"
          onError={() => setError(true)}
          className={className}
          {...p}
        />
      );
    };

    // ========================================
    // Dark mode toggle hook
    // ========================================
    const useDarkMode = () => {
      const [dark, setDark] = useState(() => {
        try {
          const saved = localStorage.getItem('kyul-theme');
          if (saved) return saved === 'dark';
          return window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {
          return false;
        }
      });
      useEffect(() => {
        const root = document.documentElement;
        if (dark) root.classList.add('dark');
        else root.classList.remove('dark');
        try {
          localStorage.setItem('kyul-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      }, [dark]);
      return [dark, setDark];
    };

    // ========================================
    // Brand Data
    // ========================================
    const NAV_LINKS = [
      { label: '거실', href: '#living' },
      { label: '침실', href: '#bedroom' },
      { label: '다이닝', href: '#dining' },
      { label: '홈오피스', href: '#office' },
      { label: '컬렉션', href: '#collection' },
    ];

    const CATEGORIES = [
      {
        name: '소파',
        sub: '거실의 중심',
        image:
          'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=800&q=80',
      },
      {
        name: '의자',

        image:
          'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=800&q=80',
      },
      {
        name: '테이블',
        sub: '함께 모이는 자리',
        image:
          'https://images.unsplash.com/photo-1581539250439-c96689b516dd?w=800&q=80',
      },
      {
        name: '침대',
        sub: '깊은 밤의 결',
        image:
          'https://images.unsplash.com/photo-1538688525198-9b88f6f53126?w=800&q=80',
      },
      {
        name: '수납',
        sub: '비움과 채움',
        image:
          'https://images.unsplash.com/photo-1594620302200-9a762244a156?w=800&q=80',
      },
      {
        name: '조명',
        sub: '한지 빛의 온기',
        image:
          'https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?w=800&q=80',
      },
    ];

    const PRODUCTS = [
      {
        id: 'p1',
        name: '노을 라운지 체어',
        category: '의자',
        price: 890000,
        original: 1090000,
        rating: 4.8,

        tag: 'BEST',

        image:
          'https://images.unsplash.com/photo-1567538096630-e0c55bd6374c?w=800&q=80',
      },
      {
        id: 'p2',
        name: '결 3인 소파',

    const Testimonials = () => (
      <section className="bg-muted/30 border-y">
        <div className="container py-16 sm:py-20">
          <div className="text-center mb-12">
            <p className="text-xs uppercase tracking-widest text-muted-foreground mb-2">

    const Newsletter = () => {
      const toast = useToast();
      const [email, setEmail] = useState('');
      const [submitted, setSubmitted] = useState(false);
      const onSubmit = (e) => {
        e.preventDefault();
        if (!email || !/.+@.+\..+/.test(email)) {
          toast.push({
            title: '올바른 이메일을 입력해 주세요',
            description: '쿠폰 발송을 위해 정확한 주소가 필요합니다.',
          });
          return;
        }
        setSubmitted(true);
        toast.push({
          title: '구독이 완료되었어요',
          description: '첫 구매 10% 쿠폰이 메일로 발송됩니다.',
        });
      };
      return (
        <section className="container py-16 sm:py-24">
          <Card className="border-0 bg-primary text-primary-foreground overflow-hidden relative">
            <CardContent className="p-8 sm:p-12 lg:p-16 grid lg:grid-cols-2 gap-8 items-center">
              <div>
                <p className="text-xs uppercase tracking-widest opacity-70 mb-3">
                  Newsletter
                </p>
                <h2 className="font-serif text-3xl sm:text-4xl font-semibold tracking-tight leading-tight">
                  결의 소식,
                  <br />
                  먼저 받아보세요.
                </h2>
                <p className="mt-4 opacity-80 max-w-md">
                  신상품 출시, 시즌 컬렉션, 멤버 단독 세일 소식을 매주 한 통.
                  지금 구독하면 첫 구매 10% 쿠폰을 보내드립니다.
                </p>
              </div>
              <div>
                {submitted ? (
                  <div className="rounded-lg border border-primary-foreground/20 bg-primary-foreground/5 p-6 flex items-start gap-3">
                    <div className="rounded-full bg-primary-foreground/15 p-2">
                      {I.check({ size: 18, strokeWidth: 2.5 })}
                    </div>
                    <div>
                      <p className="font-semibold">구독해 주셔서 감사합니다</p>
                      <p className="text-sm opacity-80 mt-1">
                        {email} 으로 환영 쿠폰을 보내드렸어요.
                      </p>
                    </div>
                  </div>
                ) : (
                  <form
                    onSubmit={onSubmit}
                    className="flex flex-col sm:flex-row gap-3"
                  >
                    <Input
                      type="email"
                      required
                      placeholder="이메일 주소"
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      className="bg-primary-foreground text-foreground border-primary-foreground placeholder:text-muted-foreground h-12"
                    />
                    <Button
                      type="submit"
                      size="lg"
                      variant="secondary"
                      className="h-12 shrink-0"
                    >
                      구독하기
                    </Button>
                  </form>
                )}
                <p className="text-xs opacity-60 mt-4">
                  언제든 수신 거부할 수 있습니다. 개인정보처리방침에 동의합니다.
                </p>
              </div>
            </CardContent>
          </Card>
        </section>
      );
    };

    const Footer = () => {
      const cols = [
        {
          title: '쇼핑',
          links: ['거실', '침실', '다이닝', '홈오피스', '조명', '세일'],
        },
        {
          title: '고객지원',
          links: ['배송 안내', '설치 안내', '반품·교환', '제품 케어', 'A/S 문의'],
        },
        {
          title: '브랜드',
          links: ['브랜드 스토리', '쇼룸 위치', '저널', '뉴스레터', '채용'],
        },
        {
          title: '정책',
          links: ['이용약관', '개인정보처리방침', '청소년 보호정책', '사업자 정보'],
        },
      ];
      return (
        <footer className="border-t bg-background">
          <div className="container py-14">
            <div className="grid gap-10 lg:grid-cols-5">
              <div className="lg:col-span-2">
                <Logo />
                <p className="mt-4 text-sm text-muted-foreground max-w-sm leading-relaxed">
                  스칸디나비안 미니멀리즘과 한국 자연 소재의 만남.
                  10년 후에도 처음 그대로의 단정함을 유지하는 가구를 만듭니다.
                </p>
                <div className="mt-6 flex gap-2">
                  <Button size="icon" variant="outline" aria-label="Instagram">
                    {I.instagram({ size: 16 })}
                  </Button>
                  <Button size="icon" variant="outline" aria-label="YouTube">
                    {I.youtube({ size: 16 })}
                  </Button>
                  <Button size="icon" variant="outline" aria-label="Pinterest">
                    {I.pinterest({ size: 16 })}
                  </Button>
                </div>
              </div>
              {cols.map((c) => (
                <div key={c.title}>
                  <p className="text-sm font-semibold mb-4">{c.title}</p>
                  <ul className="space-y-2.5">
                    {c.links.map((l) => (
                      <li key={l}>
                        <a
                          href="#"
                          className="text-sm text-muted-foreground hover:text-foreground transition-colors"
                        >
                          {l}
                        </a>
                      </li>
                    ))}
                  </ul>
                </div>
              ))}
            </div>
            <Separator className="my-10" />
            <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4 text-xs text-muted-foreground">
              <div className="space-y-1">
                <p>(주)결 · 대표 김도윤 · 사업자등록번호 123-45-67890</p>
                <p>경기도 파주시 헤이리마을길 70-12 · 통신판매업 2024-파주-0234호</p>
                <p>고객센터 1599-0000 · 평일 10:00 – 18:00 (점심 12:30 – 13:30)</p>
              </div>
              <p>© 2026 KYUL. All rights reserved.</p>
            </div>
          </div>
        </footer>
      );
    };

    // ========================================
    // Cart Sheet
    // ========================================
    const CartSheet = ({ open, onOpenChange, items, onRemove, onClear }) => {
      const total = items.reduce((s, it) => s + it.price * it.qty, 0);
      return (
        <Sheet open={open} onOpenChange={onOpenChange}>
          <div className="flex items-center justify-between mb-6">
            <div>
              <p className="font-serif text-xl font-semibold">장바구니</p>
              <p className="text-xs text-muted-foreground">
                {items.length === 0 ? '담긴 상품이 없습니다' : `${items.length}개 상품`}
              </p>
            </div>
            <Button
              variant="ghost"
              size="icon"
              aria-label="닫기"
              onClick={() => onOpenChange(false)}
            >
              {I.x({ size: 18 })}
            </Button>
          </div>
          {items.length === 0 ? (
            <div className="flex flex-col items-center justify-center text-center py-16 text-muted-foreground">
              <div className="rounded-full bg-muted p-4 mb-4">
                {I.bag({ size: 24 })}
              </div>
              <p className="text-sm">마음에 드는 가구를 담아보세요.</p>
              <Button
                variant="outline"
                className="mt-6"
                onClick={() => onOpenChange(false)}
              >
                계속 둘러보기
              </Button>
            </div>
          ) : (
            <>
              <div className="flex-1 overflow-y-auto -mx-1 px-1 max-h-[calc(100vh-300px)]">
                <ul className="space-y-4">
                  {items.map((it) => (
                    <li key={it.id} className="flex gap-3">
                      <div className="h-16 w-16 rounded-md overflow-hidden bg-muted shrink-0 border">
                        <SafeImage
                          src={it.image}
                          alt={it.name}
                          className="w-full h-full object-cover"
                        />
                      </div>
                      <div className="flex-1 min-w-0">
                        <p className="text-sm font-medium truncate">{it.name}</p>
                        <p className="text-xs text-muted-foreground">
                          수량 {it.qty}
                        </p>
                        <p className="text-sm font-semibold mt-1">
                          {formatKRW(it.price * it.qty)}
                        </p>
                      </div>
                      <Button
                        size="icon"
                        variant="ghost"
                        aria-label="삭제"
                        onClick={() => onRemove(it.id)}
                      >
                        {I.x({ size: 14 })}
                      </Button>
                    </li>
                  ))}
                </ul>
              </div>
              <div className="absolute bottom-0 left-0 right-0 p-6 border-t bg-background">
                <div className="flex items-baseline justify-between mb-1">
                  <span className="text-sm text-muted-foreground">합계</span>
                  <span className="font-serif text-2xl font-semibold">
                    {formatKRW(total)}
                  </span>
                </div>
                <p className="text-xs text-muted-foreground mb-4">
                  배송비 포함, 5만원 이상 무료 배송
                </p>
                <Button className="w-full" size="lg">
                  결제하기 {I.arrowRight({ size: 14 })}
                </Button>
                <Button
                  variant="ghost"
                  className="w-full mt-1"
                  onClick={onClear}
                >
                  장바구니 비우기
                </Button>
              </div>
            </>
          )}
        </Sheet>
      );
    };

    // ========================================
    // App
    // ========================================
    const Shell = () => {
      const [cart, setCart] = useState([]);
      const [cartOpen, setCartOpen] = useState(false);
      const toast = useToast();

      const cartCount = useMemo(
        () => cart.reduce((s, c) => s + c.qty, 0),
        [cart]
      );

      const addToCart = useCallback(
        (product) => {
          setCart((prev) => {
            const exist = prev.find((p) => p.id === product.id);
            if (exist) {
              return prev.map((p) =>
                p.id === product.id ? { ...p, qty: p.qty + 1 } : p
              );
            }
            return [...prev, { ...product, qty: 1 }];
          });
          toast.push({
            title: '장바구니에 담았어요',
            description: product.name,
          });
        },
        [toast]
      );

      const removeFromCart = (id) =>
        setCart((prev) => prev.filter((p) => p.id !== id));

      const scrollToProducts = () => {
        const el = document.getElementById('products');
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      return (
        <div className="min-h-screen flex flex-col">
          <Header cartCount={cartCount} onOpenCart={() => setCartOpen(true)} />
          <main className="flex-1">
            <Hero onShop={scrollToProducts} />
            <ValueProps />
            <Categories />
            <Products onAdd={addToCart} />
            <BrandStory />
            <CollectionBanners />
            <Testimonials />
            <Newsletter />
          </main>
          <Footer />
          <CartSheet
            open={cartOpen}
            onOpenChange={setCartOpen}
            items={cart}
            onRemove={removeFromCart}
            onClear={() => setCart([])}
          />
        </div>
      );
    };

    const App = () => (
      <ToastProvider>
        <Shell />
      </ToastProvider>
    );

    // ========================================
    // Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
