<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pixel Studio — 프리미엄 PNG 콘텐츠</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- TossPayments Payment Widget SDK v2 -->
  <script src="https://js.tosspayments.com/v2/standard"></script>
  <style>
    /* Smooth fade transition for paid state */
    .fade-in { animation: fadeIn .4s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    /* Subtle pulse for lock badge */
    .lock-pulse { animation: lockPulse 2.4s ease-in-out infinite; }
    @keyframes lockPulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.04); }
    }
    /* Hide scrollbar in mock UI */
    body { -webkit-font-smoothing: antialiased; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    // ========================================
    // ⚛️ React Hooks
    // ========================================
    const { useState, useEffect, useContext, createContext, useMemo, useCallback, useRef } = React;

    // ========================================
    // 💳 Product Mock Data
    // (NOTE: 실제 결제 연동은 이후 단계에서 PG사 SDK 연결 예정 — 현재는 mock 상태)
    // ========================================
    // 상품은 /api/products 에서 로드 (ProductsProvider 참조)
    const DEFAULT_PRODUCT_META = {
      format: 'PNG (1024 × 1024)',
      resolution: '1024 × 1024 px',
      license: '상업적 사용 가능 (재판매 불가)',
      delivery: '결제 즉시 다운로드',
    };

    const formatKRW = (n) => '₩' + n.toLocaleString('ko-KR');

    // ========================================
    // 🔐 Purchases Context — 서버의 /api/purchases 기반 실제 결제 상태
    // ========================================
    const PaymentContext = createContext(null);

    function PaymentProvider({ children }) {
      const { token, isAuthenticated } = useAuth();
      const [paidIds, setPaidIds] = useState(new Set());
      const [loading, setLoading] = useState(false);

      const refresh = useCallback(async () => {
        if (!isAuthenticated || !token) { setPaidIds(new Set()); return; }
        setLoading(true);
        try {
          const data = await apiRequest('/purchases', { token });
          setPaidIds(new Set(data.productIds || []));
        } catch (_) {
          setPaidIds(new Set());
        } finally {
          setLoading(false);
        }
      }, [isAuthenticated, token]);

      // 로그인 상태/토큰 변경 시 자동 동기화
      useEffect(() => { refresh(); }, [refresh]);

      const isPaid = useCallback((id) => paidIds.has(id), [paidIds]);

      const value = useMemo(() => ({
        paidIds, isPaid, paidCount: paidIds.size, loading, refresh,
      }), [paidIds, isPaid, loading, refresh]);

      return <PaymentContext.Provider value={value}>{children}</PaymentContext.Provider>;
    }

    const usePayment = () => useContext(PaymentContext);

    // ========================================
    // 🔍 Hash-routing safe query parser (Toss successUrl 핸들링)
    // 토스는 paymentKey/orderId/amount를 hash 앞 location.search 에 붙이고
    // paymentType=NORMAL은 hash 안 query string에 붙이므로 둘 다 병합해야 한다.
    // ========================================
    function parseHashQuery() {
      const params = new URLSearchParams();
      const search = new URLSearchParams(window.location.search);
      search.forEach((v, k) => params.set(k, v));
      const hash = window.location.hash;
      const qIdx = hash.indexOf('?');
      if (qIdx !== -1) {
        const inner = new URLSearchParams(hash.slice(qIdx + 1));
        inner.forEach((v, k) => params.set(k, v));
      }
      return params;
    }

    // ========================================
    // 🔑 Auth API + Context (JWT, localStorage 토큰)
    // ========================================
    const API_BASE_URL = '/api';

    async function apiRequest(endpoint, { method = 'GET', body, token } = {}) {
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers.Authorization = `Bearer ${token}`;
      const res = await fetch(`${API_BASE_URL}${endpoint}`, {
        method,
        headers,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const err = new Error(data.message || '요청에 실패했습니다.');
        err.code = data.error;
        err.status = res.status;
        throw err;
      }
      return data;
    }

    const AuthContext = createContext(null);

    function AuthProvider({ children }) {
      const [token, setToken] = useState(() => {
        try { return localStorage.getItem('auth_token') || null; } catch (_) { return null; }
      });
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(!!token);

      // 토큰 ↔ localStorage 동기화
      useEffect(() => {
        try {
          if (token) localStorage.setItem('auth_token', token);
          else localStorage.removeItem('auth_token');
        } catch (_) {}
      }, [token]);

      // 부팅 시 토큰 검증 + 사용자 정보 로드
      useEffect(() => {
        let cancelled = false;
        if (!token) { setUser(null); setLoading(false); return; }
        setLoading(true);
        apiRequest('/auth/me', { token })
          .then((data) => { if (!cancelled) setUser(data.user); })
          .catch(() => {
            if (!cancelled) { setToken(null); setUser(null); }
          })
          .finally(() => { if (!cancelled) setLoading(false); });
        return () => { cancelled = true; };
      }, [token]);

      const signup = useCallback(async (email, password) => {
        const data = await apiRequest('/auth/signup', {
          method: 'POST',
          body: { email, password },
        });
        setUser(data.user);
        setToken(data.token);
        return data.user;
      }, []);

      const login = useCallback(async (email, password) => {
        const data = await apiRequest('/auth/login', {
          method: 'POST',
          body: { email, password },
        });
        setUser(data.user);
        setToken(data.token);
        return data.user;
      }, []);

      const logout = useCallback(() => {
        setUser(null);
        setToken(null);
      }, []);

      const value = useMemo(() => ({
        user, token, loading,
        isAuthenticated: !!user,
        signup, login, logout,
      }), [user, token, loading, signup, login, logout]);

      return <AuthContext.Provider value={value}>{children}</AuthContext.Provider>;
    }

    const useAuth = () => useContext(AuthContext);

    // ========================================
    // 🛍️ Products Context — /api/products 로드
    // ========================================
    const ProductsContext = createContext({ products: [], loading: true, getProduct: () => null });

    function ProductsProvider({ children }) {
      const [products, setProducts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);

      const refresh = useCallback(() => {
        setLoading(true);
        return apiRequest('/products')
          .then((data) => { setProducts(data.products || []); setError(null); })
          .catch((e) => { setError(e); setProducts([]); })
          .finally(() => setLoading(false));
      }, []);

      useEffect(() => { refresh(); }, [refresh]);

      const getProduct = useCallback((id) => products.find((p) => p.id === id) || null, [products]);

      const value = useMemo(() => ({ products, loading, error, getProduct, refresh }),
        [products, loading, error, getProduct, refresh]);

      return <ProductsContext.Provider value={value}>{children}</ProductsContext.Provider>;
    }

    const useProducts = () => useContext(ProductsContext);

    // ========================================
    // 🔀 Hash Router (lightweight)
    // ========================================
    const RouterContext = createContext(null);

    // hash에서 query string(?...)을 분리하고 path만 추출
    // 예: "#/success/neon-city?paymentType=NORMAL" → "/success/neon-city"
    function pathFromHash() {
      const raw = window.location.hash.replace(/^#/, '') || '/';
      const qIdx = raw.indexOf('?');
      return qIdx === -1 ? raw : raw.slice(0, qIdx);
    }

    function Router({ children }) {
      const [path, setPath] = useState(pathFromHash);

      useEffect(() => {
        const onHash = () => setPath(pathFromHash());
        window.addEventListener('hashchange', onHash);
        return () => window.removeEventListener('hashchange', onHash);
      }, []);

      const navigate = useCallback((to) => {
        window.location.hash = to;
      }, []);

      return (
        <RouterContext.Provider value={{ path, navigate }}>
          {children}
        </RouterContext.Provider>
      );
    }

    function matchRoute(pattern, path) {
      const patternParts = pattern.split('/').filter(Boolean);
      const pathParts = path.split('/').filter(Boolean);
      if (patternParts.length !== pathParts.length) return null;
      const params = {};
      for (let i = 0; i < patternParts.length; i++) {
        if (patternParts[i].startsWith(':')) {
          params[patternParts[i].slice(1)] = decodeURIComponent(pathParts[i]);
        } else if (patternParts[i] !== pathParts[i]) {
          return null;
        }
      }
      return params;
    }

    function Routes({ children }) {
      const { path } = useContext(RouterContext);
      const arr = React.Children.toArray(children);
      for (const child of arr) {
        const params = matchRoute(child.props.path, path);
        if (params) {
          return React.cloneElement(child.props.element, { params });
        }
      }
      return arr.find(c => c.props.path === '*')?.props.element ?? null;
    }

    function Route() { return null; }

    function Link({ to, children, className = '', ...rest }) {
      const { navigate } = useContext(RouterContext);
      return (
        <a
          href={`#${to}`}
          onClick={(e) => { e.preventDefault(); navigate(to); }}
          className={className}
          {...rest}
        >
          {children}
        </a>
      );
    }

    const useRouter = () => useContext(RouterContext);

    // ========================================
    // 🎨 Design System — Button
    // ========================================
    function Button({
      variant = 'primary',
      size = 'md',
      disabled = false,
      onClick,
      type = 'button',
      className = '',
      children,
      as: As = 'button',
      ...rest
    }) {
      const sizes = {
        sm: 'px-3 py-1.5 text-sm',
        md: 'px-5 py-2.5 text-sm',
        lg: 'px-6 py-3.5 text-base',
      };
      const variants = {
        primary:
          'text-white bg-gradient-to-r from-indigo-500 to-violet-600 hover:from-indigo-600 hover:to-violet-700 shadow-md shadow-indigo-500/20',
        secondary:
          'text-slate-800 bg-white hover:bg-slate-50 border border-slate-200',
        ghost:
          'text-slate-700 bg-transparent hover:bg-slate-100',
        danger:
          'text-white bg-rose-500 hover:bg-rose-600 shadow-md shadow-rose-500/20',
        outline:
          'text-indigo-600 bg-white border border-indigo-200 hover:bg-indigo-50',
      };
      const base =
        'inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition-all duration-150 ' +
        'focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:ring-offset-2 ' +
        'disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.98]';
      return (
        <As
          type={As === 'button' ? type : undefined}
          onClick={disabled ? undefined : onClick}
          disabled={As === 'button' ? disabled : undefined}
          className={`${base} ${sizes[size]} ${variants[variant]} ${className}`}
          {...rest}
        >
          {children}
        </As>
      );
    }

    // ========================================
    // 🎨 Design System — Card
    // ========================================
    function Card({ children, className = '', as: As = 'div', ...rest }) {
      return (
        <As
          className={`bg-white rounded-2xl shadow-sm shadow-slate-200/60 border border-slate-100 ${className}`}
          {...rest}
        >
          {children}
        </As>
      );
    }

    // ========================================
    // 🎨 Design System — Badge
    // ========================================
    function Badge({ children, color = 'indigo', className = '' }) {
      const colors = {
        indigo: 'bg-indigo-50 text-indigo-700 ring-indigo-200',
        emerald: 'bg-emerald-50 text-emerald-700 ring-emerald-200',
        amber: 'bg-amber-50 text-amber-800 ring-amber-200',
        slate: 'bg-slate-100 text-slate-700 ring-slate-200',
        rose: 'bg-rose-50 text-rose-700 ring-rose-200',
      };
      return (
        <span className={`inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium ring-1 ring-inset ${colors[color]} ${className}`}>
          {children}
        </span>
      );
    }

    // ========================================
    // 🎨 Design System — Input
    // ========================================
    function Input({
      label,
      type = 'text',
      value,
      onChange,
      placeholder,
      error,
      disabled,
      hint,
      className = '',
      ...rest
    }) {
      return (
        <label className={`block ${className}`}>
          {label && <span className="block text-sm font-medium text-slate-700 mb-1.5">{label}</span>}
          <input
            type={type}
            value={value}
            onChange={onChange}
            placeholder={placeholder}
            disabled={disabled}
            className={`w-full px-4 py-3 rounded-xl border bg-white text-slate-900 placeholder-slate-400
              focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400
              disabled:bg-slate-50 disabled:text-slate-500 transition
              ${error ? 'border-rose-300 focus:ring-rose-300 focus:border-rose-300' : 'border-slate-200'}`}
            {...rest}
          />
          {hint && !error && <span className="block text-xs text-slate-500 mt-1.5">{hint}</span>}
          {error && <span className="block text-xs text-rose-600 mt-1.5">{error}</span>}
        </label>
      );
    }

    // ========================================
    // 🧩 Header (with demo paid-toggle)
    // ========================================
    function Header() {
      const { paidCount } = usePayment();
      const { user, isAuthenticated, logout, loading } = useAuth();
      const { navigate } = useRouter();

      const handleLogout = () => {
        logout();
        navigate('/');
      };

      return (
        <header className="sticky top-0 z-20 backdrop-blur bg-white/80 border-b border-slate-200/70">
          <div className="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
            <Link to="/" className="flex items-center gap-2 group">
              <span className="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center text-white font-black shadow-sm">P</span>
              <span className="font-bold text-slate-900 group-hover:text-indigo-600 transition">Pixel Studio</span>
            </Link>

            <div className="flex items-center gap-2 sm:gap-3">
              {/* 인증 영역 */}
              {loading ? (
                <span className="text-xs text-slate-400">불러오는 중…</span>
              ) : isAuthenticated ? (
                <div className="flex items-center gap-2">
                  <span className="hidden sm:inline text-xs text-slate-500">안녕하세요,</span>
                  <span className="text-sm font-medium text-slate-800 max-w-[140px] sm:max-w-[200px] truncate" title={user?.email}>
                    {user?.email}
                  </span>
                  <Button size="sm" variant="ghost" onClick={handleLogout}>로그아웃</Button>
                </div>
              ) : (
                <div className="flex items-center gap-1">
                  <Link to="/login">
                    <Button size="sm" variant="ghost" as="span">로그인</Button>
                  </Link>
                  <Link to="/signup">
                    <Button size="sm" as="span">회원가입</Button>
                  </Link>
                </div>
              )}

              {/* 구매 카운트 (로그인 시) */}
              {isAuthenticated && (
                <>
                  <span className="hidden sm:inline-block h-5 w-px bg-slate-200 mx-1"></span>
                  <span
                    className="hidden sm:inline-flex items-center text-xs px-3 py-1.5 rounded-full bg-indigo-50 text-indigo-700 ring-1 ring-inset ring-indigo-200"
                    title="결제 완료된 콘텐츠 수"
                  >
                    🎁 보유 {paidCount}개
                  </span>
                </>
              )}
            </div>
          </div>
        </header>
      );
    }

    // ========================================
    // 🧩 Footer
    // ========================================
    function Footer() {
      return (
        <footer className="mt-16 border-t border-slate-200/70 bg-white/60">
          <div className="max-w-5xl mx-auto px-4 sm:px-6 py-6 text-xs text-slate-500 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
            <div>© 2026 Pixel Studio · 사업자/약관/환불정책 (데모)</div>
            <div className="flex items-center gap-3">
              <span>고객센터 help@pixelstudio.demo</span>
              <Badge color="emerald">🔒 SSL 보호</Badge>
            </div>
          </div>
        </footer>
      );
    }

    // ========================================
    // 🧩 Locked / Unlocked Preview (상세 페이지 큰 미리보기)
    // ========================================
    function ProductPreview({ product }) {
      const { isPaid } = usePayment();
      const paid = isPaid(product.id);
      return (
        <div className="relative aspect-square w-full overflow-hidden rounded-2xl bg-slate-100 ring-1 ring-slate-200">
          <img
            src={product.previewUrl}
            alt={product.title}
            className={`w-full h-full object-cover transition-all duration-500
              ${paid ? 'blur-0 scale-100' : 'blur-lg scale-105 brightness-90'}`}
            draggable={false}
          />
          {!paid && (
            <div className="absolute inset-0 flex flex-col items-center justify-center text-white">
              <div className="absolute inset-0 bg-gradient-to-b from-black/10 via-black/30 to-black/60" />
              <div className="relative z-10 flex flex-col items-center text-center px-6">
                <div className="lock-pulse w-16 h-16 rounded-full bg-white/15 ring-1 ring-white/30 backdrop-blur grid place-items-center text-3xl">
                  🔒
                </div>
                <p className="mt-4 font-semibold text-base sm:text-lg drop-shadow">결제 후 다운로드 가능합니다</p>
                <p className="mt-1 text-sm text-white/80">미리보기는 흐림 처리되어 있어요</p>
              </div>
            </div>
          )}
          {paid && (
            <div className="absolute top-3 left-3 z-10 fade-in">
              <Badge color="emerald" className="shadow-sm bg-white/95">✓ 구매 완료 · 고화질</Badge>
            </div>
          )}
        </div>
      );
    }

    // ========================================
    // 🧩 Product Card (그리드 카드)
    // ========================================
    function ProductCard({ product }) {
      const { isPaid } = usePayment();
      const { navigate } = useRouter();
      const paid = isPaid(product.id);

      const goDetail = () => navigate(`/product/${product.id}`);

      return (
        <Card className="overflow-hidden group cursor-pointer hover:shadow-md hover:-translate-y-0.5 transition-all duration-200" onClick={goDetail}>
          <div className="relative aspect-square overflow-hidden bg-slate-100">
            <img
              src={product.previewUrl}
              alt={product.title}
              className={`w-full h-full object-cover transition-all duration-500 group-hover:scale-105
                ${paid ? 'blur-0' : 'blur-md brightness-95'}`}
              draggable={false}
              loading="lazy"
            />
            {!paid && (
              <>
                <div className="absolute inset-0 bg-gradient-to-b from-black/0 via-black/20 to-black/50" />
                <div className="absolute inset-0 grid place-items-center">
                  <div className="w-12 h-12 rounded-full bg-white/15 ring-1 ring-white/30 backdrop-blur grid place-items-center text-xl text-white">🔒</div>
                </div>
              </>
            )}
            {paid && (
              <div className="absolute top-2 left-2 fade-in">
                <Badge color="emerald" className="shadow-sm bg-white/95">✓ 구매 완료</Badge>
              </div>
            )}
            {product.tag && !paid && (
              <div className="absolute top-2 right-2">
                <Badge color={product.tag === '베스트' ? 'rose' : product.tag === '신상' ? 'indigo' : 'amber'} className="shadow-sm bg-white/95">
                  {product.tag}
                </Badge>
              </div>
            )}
          </div>
          <div className="p-4">
            <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wide">{product.category}</p>
            <h3 className="mt-1 font-bold text-slate-900 truncate">{product.title}</h3>
            <p className="text-sm text-slate-500 truncate">{product.tagline}</p>
            <div className="mt-3 flex items-baseline gap-2">
              <span className="text-lg font-extrabold text-slate-900">{formatKRW(product.price)}</span>
              {product.originalPrice && (
                <span className="text-xs text-slate-400 line-through">{formatKRW(product.originalPrice)}</span>
              )}
            </div>
          </div>
        </Card>
      );
    }

    // ========================================
    // 🧩 Download Helper
    // ========================================
    async function downloadPng(url, filename) {
      try {
        const res = await fetch(url, { mode: 'cors' });
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = objectUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1500);
      } catch (_) {
        // Fallback: open in new tab
        window.open(url, '_blank', 'noopener');
      }
    }

    // ========================================
    // 📄 Page — Products List (메인, 그리드)
    // ========================================
    function ProductsListPage() {
      const { paidCount } = usePayment();
      const { products, loading } = useProducts();
      const totalCount = products.length;

      return (
        <main className="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
          {/* Hero banner */}
          <section className="relative overflow-hidden rounded-3xl bg-gradient-to-br from-indigo-500 via-violet-600 to-purple-600 text-white p-8 sm:p-12 mb-8">
            <div className="absolute -top-12 -right-12 w-48 h-48 rounded-full bg-white/10 blur-2xl" />
            <div className="absolute -bottom-16 -left-16 w-60 h-60 rounded-full bg-pink-300/20 blur-3xl" />
            <div className="relative">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/15 ring-1 ring-white/20 text-xs font-medium mb-3">
                ✨ Premium PNG Collection
              </div>
              <h1 className="text-3xl sm:text-4xl font-extrabold tracking-tight">
                바로 쓰는 프리미엄 PNG 9종
              </h1>
              <p className="mt-3 text-white/85 text-sm sm:text-base max-w-xl">
                AI로 생성한 상업용 사용 가능한 고해상도 일러스트. 결제 즉시 다운로드.

    // ========================================
    // 📄 Page — Checkout (TossPayments 위젯)
    // ========================================
    function CheckoutPage({ params }) {
      const { getProduct, loading: productsLoading } = useProducts();
      const product = getProduct(params?.id);
      const { isAuthenticated, user, token, loading: authLoading } = useAuth();
      const { isPaid } = usePayment();
      const { navigate } = useRouter();

      const widgetsRef = useRef(null);
      const renderedRef = useRef(false);

      const [order, setOrder] = useState(null);              // { orderId, amount, orderName }
      const [clientKey, setClientKey] = useState(null);
      const [widgetReady, setWidgetReady] = useState(false);
      const [error, setError] = useState('');
      const [paying, setPaying] = useState(false);

      // 로그인 안 된 경우 로그인 페이지로
      useEffect(() => {
        if (!authLoading && !isAuthenticated) navigate('/login');
      }, [authLoading, isAuthenticated]);

      // 이미 구매한 상품이면 상세로
      useEffect(() => {
        if (product && isPaid(product.id)) navigate(`/product/${product.id}`);
      }, [product, isPaid]);

      // 1. 토스 클라이언트 키 로드
      useEffect(() => {
        apiRequest('/config')
          .then((d) => setClientKey(d.tossClientKey))
          .catch((e) => setError(e.message || '결제 설정을 불러오지 못했습니다.'));
      }, []);

      // 2. 주문 생성
      useEffect(() => {
        if (!product || !token) return;
        apiRequest('/orders', { method: 'POST', body: { productId: product.id }, token })
          .then(setOrder)
          .catch((e) => {
            if (e.code === 'ALREADY_PURCHASED') navigate(`/product/${product.id}`);
            else setError(e.message || '주문 생성에 실패했습니다.');
          });
      }, [product, token]);

      // 3. 토스 위젯 초기화 + 렌더 (단 한 번)
      useEffect(() => {
        if (!order || !clientKey || !user || renderedRef.current) return;
        if (typeof window.TossPayments !== 'function') {
          setError('토스 SDK가 로드되지 않았습니다.');
          return;
        }

        (async () => {
          try {
            const toss = window.TossPayments(clientKey);
            const widgets = toss.widgets({ customerKey: `user_${user.id}` });
            widgetsRef.current = widgets;

            await widgets.setAmount({ currency: 'KRW', value: order.amount });
            await widgets.renderPaymentMethods({ selector: '#payment-method', variantKey: 'DEFAULT' });
            await widgets.renderAgreement({ selector: '#agreement', variantKey: 'AGREEMENT' });

            renderedRef.current = true;
            setWidgetReady(true);
          } catch (e) {
            setError(e?.message || '결제 위젯 초기화에 실패했습니다.');
          }
        })();
      }, [order, clientKey, user]);

      const handlePay = async () => {
        if (!widgetsRef.current || !order || !product) return;
        setPaying(true);
        setError('');
        try {
          await widgetsRef.current.requestPayment({
            orderId: order.orderId,
            orderName: order.orderName || product.title,
            successUrl: `${window.location.origin}/#/success/${product.id}`,
            failUrl:    `${window.location.origin}/#/fail/${product.id}`,
            customerEmail: user.email,
            customerName: user.email.split('@')[0],
          });
          // requestPayment는 페이지를 이동시키므로 보통 여기 도달 안 함
        } catch (err) {
          setPaying(false);
          if (err?.code === 'USER_CANCEL') {
            setError('결제가 취소되었습니다.');
          } else {
            setError(err?.message || '결제 요청에 실패했습니다.');
          }
        }
      };

      if (productsLoading) return <main className="max-w-3xl mx-auto px-4 py-12 text-slate-400">불러오는 중…</main>;
      if (!product) return <NotFoundPage />;

      return (
        <main className="max-w-3xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
          <div className="flex items-center gap-2 text-sm text-slate-500 mb-4">
            <Link to={`/product/${product.id}`} className="hover:text-indigo-600">← 상품으로</Link>
          </div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900">결제하기</h1>
          <p className="mt-1 text-slate-500 text-sm">결제 완료 즉시 콘텐츠 다운로드가 활성화됩니다.</p>

          <div className="mt-8 grid md:grid-cols-5 gap-6">
            <div className="md:col-span-3 space-y-4">
              <Card className="p-5 sm:p-6">
                <h2 className="font-semibold text-slate-900 mb-3">결제 수단</h2>
                <div id="payment-method" className="min-h-[180px]" />
                {!widgetReady && !error && (
                  <p className="text-xs text-slate-400">결제 위젯을 불러오는 중…</p>
                )}
              </Card>

              <Card className="p-5 sm:p-6">
                <h2 className="font-semibold text-slate-900 mb-3">약관 동의</h2>
                <div id="agreement" />
              </Card>

              {error && (
                <div className="px-4 py-3 rounded-xl bg-rose-50 border border-rose-100 text-sm text-rose-700">
                  {error}
                </div>
              )}

              <Button
                size="lg"
                className="w-full"
                onClick={handlePay}
                disabled={!widgetReady || paying}
              >
                {paying ? '결제창 여는 중…' : `${formatKRW(order?.amount ?? product.price)} 결제하기`}
              </Button>

              <p className="text-xs text-slate-400 text-center leading-5">
                * 토스 공식 테스트 상점 키를 사용하고 있어 실제 청구가 발생하지 않습니다.<br />
                테스트 카드: 임의 16자리, 미래 만료일, 임의 CVC/비밀번호.
              </p>
            </div>

            <aside className="md:col-span-2">
              <Card className="p-5 sm:p-6 sticky top-20">
                <h2 className="font-semibold text-slate-900 mb-4">주문 요약</h2>
                <div className="flex gap-3 items-start">
                  <img
                    src={product.previewUrl}
                    alt=""
                    className="w-16 h-16 rounded-lg object-cover ring-1 ring-slate-200 blur-sm"
                  />
                  <div className="min-w-0">
                    <p className="text-sm font-medium text-slate-900 truncate">{product.title}</p>
                    <p className="text-xs text-slate-500 mt-0.5">{DEFAULT_PRODUCT_META.format}</p>
                  </div>
                </div>

                <div className="mt-5 space-y-2 text-sm">
                  <div className="flex justify-between text-slate-600">
                    <span>상품 금액</span>
                    <span>{formatKRW(product.originalPrice || product.price)}</span>
                  </div>
                  <div className="flex justify-between text-slate-600">
                    <span>할인</span>
                    <span className="text-rose-500">
                      −{formatKRW((product.originalPrice || product.price) - product.price)}
                    </span>
                  </div>
                  <div className="border-t border-slate-100 my-2"></div>
                  <div className="flex justify-between items-baseline">
                    <span className="font-semibold text-slate-900">총 결제 금액</span>
                    <span className="text-xl font-black bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                      {formatKRW(order?.amount ?? product.price)}
                    </span>
                  </div>
                </div>

                {order?.orderId && (
                  <div className="mt-4 text-[10px] text-slate-400 break-all">
                    주문번호: {order.orderId}
                  </div>
                )}

                <div className="mt-5 p-3 rounded-lg bg-indigo-50/70 text-xs text-indigo-700 leading-5">
                  🔒 결제 정보는 토스페이먼츠를 통해 암호화 처리되며 본 서비스에 저장되지 않습니다.
                </div>
              </Card>
            </aside>
          </div>
        </main>
      );
    }

    // ========================================
    // 📄 Page — Success (토스 confirm 호출 + 다운로드)
    // ========================================
    function SuccessPage({ params }) {
      const { getProduct } = useProducts();
      const product = getProduct(params?.id);
      const { token, isAuthenticated, loading: authLoading } = useAuth();
      const { refresh } = usePayment();
      const { navigate } = useRouter();

      const [phase, setPhase] = useState('confirming'); // confirming | paid | error
      const [errorMsg, setErrorMsg] = useState('');
      const [downloading, setDownloading] = useState(false);
      const confirmedRef = useRef(false); // StrictMode/리렌더에서 중복 호출 차단

      useEffect(() => {
        if (authLoading) return;
        if (!isAuthenticated) { navigate('/login'); return; }
        if (!product) { navigate('/'); return; }
        if (confirmedRef.current) return;

        const q = parseHashQuery();
        const paymentKey = q.get('paymentKey');
        const orderId = q.get('orderId');
        const amount = q.get('amount');

        if (!paymentKey || !orderId || !amount) {
          setPhase('error');
          setErrorMsg('결제 정보가 올바르지 않습니다.');
          return;
        }

        confirmedRef.current = true;
        apiRequest('/payments/confirm', {
          method: 'POST',
          body: { paymentKey, orderId, amount: Number(amount) },
          token,
        })
          .then(async () => {
            await refresh();
            setPhase('paid');
            // confirm 성공 후 query 정리 — 새로고침해도 재confirm 방지 + 민감정보 URL 노출 최소화
            const cleanUrl = window.location.pathname + window.location.hash;
            window.history.replaceState({}, '', cleanUrl);
          })
          .catch((e) => {
            setPhase('error');
            setErrorMsg(e?.message || '결제 승인에 실패했습니다.');
          });
      }, [authLoading, isAuthenticated, product, token]);

      const handleDownload = async () => {
        if (!product) return;
        setDownloading(true);
        await downloadPng(product.previewUrl, `${product.id}.png`);
        setDownloading(false);
      };

      if (!product) return null;

      return (
        <main className="max-w-xl mx-auto px-4 sm:px-6 py-10 sm:py-16">
          <Card className="p-8 sm:p-10 text-center fade-in">
            {phase === 'confirming' && (
              <>
                <div className="mx-auto w-20 h-20 rounded-full bg-gradient-to-br from-indigo-400 to-violet-500 grid place-items-center text-white text-4xl shadow-lg shadow-indigo-500/30 animate-pulse">
                  ⏳
                </div>
                <h1 className="mt-6 text-2xl sm:text-3xl font-extrabold text-slate-900">결제를 확인하는 중…</h1>
                <p className="mt-2 text-slate-600">잠시만 기다려주세요.</p>
              </>
            )}

            {phase === 'paid' && (
              <>
                <div className="mx-auto w-20 h-20 rounded-full bg-gradient-to-br from-emerald-400 to-emerald-600 grid place-items-center text-white text-4xl shadow-lg shadow-emerald-500/30">
                  ✓
                </div>
                <h1 className="mt-6 text-2xl sm:text-3xl font-extrabold text-slate-900">결제가 완료되었습니다</h1>
                <p className="mt-2 text-slate-600">이제 콘텐츠를 자유롭게 다운로드할 수 있어요.</p>

                <div className="mt-6 p-4 rounded-xl bg-slate-50 border border-slate-100 text-left">
                  <div className="flex items-center gap-3">
                    <img src={product.previewUrl} alt="" className="w-14 h-14 rounded-lg object-cover ring-1 ring-slate-200" />
                    <div className="min-w-0">
                      <p className="text-sm font-semibold text-slate-900 truncate">{product.title}</p>
                      <p className="text-xs text-slate-500">{DEFAULT_PRODUCT_META.format}</p>
                    </div>
                    <div className="ml-auto text-sm font-bold text-slate-900">{formatKRW(product.price)}</div>
                  </div>
                </div>

                <div className="mt-7 grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <Button size="lg" onClick={handleDownload} disabled={downloading}>
                    {downloading ? '다운로드 중…' : '⬇  PNG 다운로드'}
                  </Button>
                  <Button size="lg" variant="secondary" onClick={() => navigate('/')}>
                    다른 상품 보기
                  </Button>
                </div>

                <p className="mt-6 text-xs text-slate-400">
                  영수증은 가입하신 이메일로 발송됩니다.
                </p>
              </>
            )}

            {phase === 'error' && (
              <>
                <div className="mx-auto w-20 h-20 rounded-full bg-gradient-to-br from-rose-400 to-rose-600 grid place-items-center text-white text-4xl shadow-lg shadow-rose-500/30">
                  ⚠
                </div>
                <h1 className="mt-6 text-2xl sm:text-3xl font-extrabold text-slate-900">결제 승인에 실패했습니다</h1>
                <p className="mt-2 text-slate-600 text-sm">{errorMsg}</p>
                <div className="mt-7 grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <Button size="lg" onClick={() => navigate(`/checkout/${product.id}`)}>
                    다시 결제하기
                  </Button>
                  <Button size="lg" variant="secondary" onClick={() => navigate(`/product/${product.id}`)}>
                    상품으로
                  </Button>
                </div>
              </>
            )}
          </Card>
        </main>
      );
    }

    // ========================================
    // 📄 Page — Fail (토스 failUrl 콜백)
    // ========================================
    function FailPage({ params }) {
      const { getProduct } = useProducts();
      const product = getProduct(params?.id);
      const { navigate } = useRouter();
      const [info, setInfo] = useState({ code: '', message: '' });

      useEffect(() => {
        const q = parseHashQuery();
        setInfo({
          code: q.get('code') || '',
          message: q.get('message') || '결제가 취소되거나 실패했습니다.',
        });
        const cleanUrl = window.location.pathname + window.location.hash;
        window.history.replaceState({}, '', cleanUrl);
      }, []);

      return (
        <main className="max-w-xl mx-auto px-4 sm:px-6 py-10 sm:py-16">
          <Card className="p-8 sm:p-10 text-center fade-in">
            <div className="mx-auto w-20 h-20 rounded-full bg-gradient-to-br from-rose-400 to-rose-600 grid place-items-center text-white text-4xl shadow-lg shadow-rose-500/30">
              ✗
            </div>
            <h1 className="mt-6 text-2xl sm:text-3xl font-extrabold text-slate-900">결제가 완료되지 않았어요</h1>
            <p className="mt-2 text-slate-600 text-sm">{info.message}</p>
            {info.code && (
              <p className="mt-2 text-xs text-slate-400">사유 코드: {info.code}</p>
            )}

            <div className="mt-7 grid grid-cols-1 sm:grid-cols-2 gap-3">
              {product ? (
                <>
                  <Button size="lg" onClick={() => navigate(`/checkout/${product.id}`)}>
                    다시 결제하기
                  </Button>
                  <Button size="lg" variant="secondary" onClick={() => navigate(`/product/${product.id}`)}>
                    상품으로
                  </Button>
                </>
              ) : (
                <Button size="lg" onClick={() => navigate('/')} className="sm:col-span-2">
                  메인으로
                </Button>
              )}
            </div>
          </Card>
        </main>
      );
    }

    // ========================================
    // 📄 Page — Login
    // ========================================
    function LoginPage() {
      const { login, isAuthenticated } = useAuth();
      const { navigate } = useRouter();

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [emailError, setEmailError] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [serverError, setServerError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      // 이미 로그인된 경우 메인으로
      useEffect(() => {
        if (isAuthenticated) navigate('/');
      }, [isAuthenticated]);

      const validate = () => {
        let ok = true;
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setEmailError('올바른 이메일 형식이 아닙니다'); ok = false;
        } else setEmailError('');
        if (!password) {
          setPasswordError('비밀번호를 입력해주세요'); ok = false;
        } else setPasswordError('');
        return ok;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setServerError('');
        if (!validate()) return;
        setSubmitting(true);
        try {
          await login(email.trim(), password);
          navigate('/');
        } catch (err) {
          setServerError(err.message || '로그인에 실패했습니다.');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <main className="max-w-md mx-auto px-4 sm:px-6 py-10 sm:py-14">
          <div className="text-center mb-8">
            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900">로그인</h1>
            <p className="mt-1 text-sm text-slate-500">계정에 로그인하고 결제한 콘텐츠를 받아보세요.</p>
          </div>

          <Card className="p-6 sm:p-8">
            <form onSubmit={handleSubmit} className="space-y-4" noValidate>
              <Input
                label="이메일"
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="you@example.com"
                error={emailError}
                autoComplete="email"
                autoFocus
              />
              <Input
                label="비밀번호"
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="비밀번호 입력"
                error={passwordError}
                autoComplete="current-password"
              />

              {serverError && (
                <div className="px-4 py-3 rounded-xl bg-rose-50 border border-rose-100 text-sm text-rose-700">
                  {serverError}
                </div>
              )}

              <Button type="submit" size="lg" className="w-full" disabled={submitting}>
                {submitting ? '로그인 중…' : '로그인'}
              </Button>
            </form>

            <div className="mt-6 text-center text-sm text-slate-500">
              아직 계정이 없으신가요?{' '}
              <Link to="/signup" className="font-semibold text-indigo-600 hover:text-indigo-700">
                회원가입
              </Link>
            </div>
          </Card>
        </main>
      );
    }

    // ========================================
    // 📄 Page — Signup
    // ========================================
    function SignupPage() {
      const { signup, isAuthenticated } = useAuth();
      const { navigate } = useRouter();

      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [passwordConfirm, setPasswordConfirm] = useState('');
      const [emailError, setEmailError] = useState('');
      const [passwordError, setPasswordError] = useState('');
      const [confirmError, setConfirmError] = useState('');
      const [serverError, setServerError] = useState('');
      const [submitting, setSubmitting] = useState(false);

      useEffect(() => {
        if (isAuthenticated) navigate('/');
      }, [isAuthenticated]);

      const validate = () => {
        let ok = true;
        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          setEmailError('올바른 이메일 형식이 아닙니다'); ok = false;
        } else setEmailError('');
        if (!password || password.length < 8) {
          setPasswordError('비밀번호는 최소 8자 이상이어야 합니다'); ok = false;
        } else setPasswordError('');
        if (password !== passwordConfirm) {
          setConfirmError('비밀번호가 일치하지 않습니다'); ok = false;
        } else setConfirmError('');
        return ok;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setServerError('');
        if (!validate()) return;
        setSubmitting(true);
        try {
          await signup(email.trim(), password);
          navigate('/');
        } catch (err) {
          setServerError(err.message || '회원가입에 실패했습니다.');
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <main className="max-w-md mx-auto px-4 sm:px-6 py-10 sm:py-14">
          <div className="text-center mb-8">
            <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900">회원가입</h1>
            <p className="mt-1 text-sm text-slate-500">이메일과 비밀번호로 빠르게 가입할 수 있어요.</p>
          </div>

          <Card className="p-6 sm:p-8">
            <form onSubmit={handleSubmit} className="space-y-4" noValidate>
              <Input
                label="이메일"
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                placeholder="you@example.com"
                error={emailError}
                autoComplete="email"
                autoFocus
              />
              <Input
                label="비밀번호"
                type="password"
                value={password}
                onChange={(e) => setPassword(e.target.value)}
                placeholder="8자 이상"
                error={passwordError}
                hint="영문/숫자/특수문자를 조합하면 더 안전합니다."
                autoComplete="new-password"
              />
              <Input
                label="비밀번호 확인"
                type="password"
                value={passwordConfirm}
                onChange={(e) => setPasswordConfirm(e.target.value)}
                placeholder="비밀번호 재입력"
                error={confirmError}
                autoComplete="new-password"
              />

              {serverError && (
                <div className="px-4 py-3 rounded-xl bg-rose-50 border border-rose-100 text-sm text-rose-700">
                  {serverError}
                </div>
              )}

              <Button type="submit" size="lg" className="w-full" disabled={submitting}>
                {submitting ? '가입 처리 중…' : '회원가입'}
              </Button>

              <p className="text-xs text-slate-400 text-center leading-5">
                가입 시 서비스 이용약관 및 개인정보 처리방침에 동의한 것으로 간주합니다.
              </p>
            </form>

            <div className="mt-6 text-center text-sm text-slate-500">
              이미 계정이 있으신가요?{' '}
              <Link to="/login" className="font-semibold text-indigo-600 hover:text-indigo-700">
                로그인
              </Link>
            </div>
          </Card>
        </main>
      );
    }

    // ========================================
    // 📄 Page — Not Found
    // ========================================
    function NotFoundPage() {
      return (
        <main className="max-w-xl mx-auto px-4 py-16 text-center">
          <div className="text-6xl">🔍</div>
          <h1 className="mt-4 text-2xl font-bold text-slate-900">페이지를 찾을 수 없어요</h1>
          <p className="mt-2 text-slate-500">주소를 다시 확인해 주세요.</p>
          <div className="mt-6">
            <Link to="/" className="inline-block">
              <Button>메인으로 돌아가기</Button>
            </Link>
          </div>
        </main>
      );
    }

    // ========================================
    // 🚀 App Root
    // ========================================
    function App() {
      return (
        <AuthProvider>
          <ProductsProvider>
            <PaymentProvider>
              <Router>
                <div className="min-h-screen flex flex-col">
                  <Header />
                <div className="flex-1">
                  <Routes>
                    <Route path="/"               element={<ProductsListPage />} />
                    <Route path="/product/:id"    element={<ProductDetailPage />} />
                    <Route path="/login"          element={<LoginPage />} />
                    <Route path="/signup"         element={<SignupPage />} />
                    <Route path="/checkout/:id"   element={<CheckoutPage />} />
                    <Route path="/success/:id"    element={<SuccessPage />} />
                    <Route path="/fail/:id"       element={<FailPage />} />
                    <Route path="*"               element={<NotFoundPage />} />
                  </Routes>
                </div>
                <Footer />
              </div>
            </Router>
            </PaymentProvider>
          </ProductsProvider>
        </AuthProvider>
      );
    }

    // ========================================
    // 🖼️ Render
    // ========================================
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
