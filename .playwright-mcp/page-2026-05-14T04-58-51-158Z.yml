                    - text: 1) 제조 음료 포함 20,000원 이상 구매 고객에게 로고머그(Tall size) 선착순 증정(병음료, 쉐이크, 아이스크림, 요거트, 푸딩, 핸디젤리 등 일부품목 제외)
                    - text: 2) 조건당 로고 머그 증정. 영수증당 최대 2개까지 증정
                    - text: "(예시: 음료 2잔 포함하여 4만원 구매 시 2개 증정)"
                    - text: 3) 스타벅스 카드 충전 금액은 제외됩니다.
                    - text: 4) 행사는 조기에 종료될 수 있습니다.
                  - generic [ref=e130]:
                    - text: 1. 사이렌 오더 이용 시에도 이벤트 참여 가능합니다.
                    - text: 2. 증정품 재고 소진의 사유로 사이렌 오더 주문 취소는 불가합니다.
                    - text: 3. 조건 당 증정으로 제조음료 2잔 포함 제/상품을 4만원 이상 구매 시, 2개 증정 가능합니다.
                    - text: 4. 병음료는 대상음료에서 제외됩니다.
                    - text: 5. 당일 구매 영수증에 한해 결제 완료 즉시 증정되며, 영수증 합산은 불가합니다.
                    - text: 6. 교환거래, 결제수단 변경 등의 재결제 시에는 이벤트 적용이 불가합니다.
                    - text: 7. 선착순 증정으로 준비수량 소진 시 이벤트는 별도의 고지 없이 종료됩니다.
                    - text: 8. 증정품 수량에 대한 유/무선상 재고 안내는 불가합니다.
                    - text: 9. 구매하신 물품의 교환/환불을 원하실 경우 (푸드제외) 반드시 영수증과 증정품을 함께 지참하시고, 최초 구매일로 부터 14일 이내 해당 상품 및 증정품을 구매한 매장에 방문해야 가능합니다.
                    - text: 10. 임직원 할인 및 모닝세트 적용 시에도 이벤트 조건에 부합 시 증정 가능합니다.
                    - text: 11. 쿠폰을 사용하시는 경우에도 최종 결제 금액이 이벤트 조건 부합시 증정 가능합니다. (무료음료쿠폰 사용음료제외)
                    - text: 12. 스타벅스 카드 충전 금액은 이벤트 적용이 불가합니다.
                    - text: 13. 보다 많은 고객의 이벤트 참여를 위해, 증정품은 1인 기준 최대 2개를 증정해드립니다.
