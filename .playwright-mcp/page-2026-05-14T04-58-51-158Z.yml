                  - paragraph [ref=e105]:
                    - link "안양호계DT" [ref=e106] [cursor=pointer]:
                      - /url: javascript:void(0)
                  - list [ref=e107]:
                    - text: "[리뉴얼 오픈이벤트] 제조음료 포함 20,000원이상 구매 고객에게 로고 머그 선착순 증정"
                    - text: "- 스타벅스 카드 충전금액, 딜리버스(배달) 주문은 이벤트 대상에서 제외됩니다."
                    - text: "- 선착순 증정으로 행사는 조기에 종료될 수 있습니다."
                  - generic [ref=e108]:
                    - text: 1. 사이렌 오더 이용 시에도 이벤트 참여 가능합니다.(단, 매장대기고객이 다수일 경우, 사이렌오더 운영중단 될수 있습니다)
                    - text: 2. 증정품 재고 소진의 사유로 사이렌 오더 주문 취소는 불가합니다.
                    - text: 3. 조건 당 증정으로 푸드 2개 포함 제/상품을 4만원 이상 구매 시, 2개 증정 가능합니다. (영수증당 조건 충족 시, 최대 2개까지 증정 가능)
                    - text: 4. 잼, 버터, 크림치즈, 병음료, 바나나는 대상 푸드에서 제외됩니다.
                    - text: 5. 당일 구매 영수증에 한해 결제완료 즉시 증정되며, 영수증 합산은 불가합니다.
                    - text: 6. 교환거래, 결제수단 변경 등의 재결제 시에는 이벤트 적용이 불가합니다.
                    - text: 7. 선착순 증정으로 준비수량 소진 시 이벤트는 별도의 고지 없이 종료됩니다.
                    - text: 8. 증정품 수량에 대한 유/무선 재고 안내는 불가합니다.
                    - text: 9. 구매하신 물품의 교환/환불을 원하실 경우(푸드제외), 반드시 영수증과 판촉물을 함께 지참하시고 최초 구매일로부터 14일 이내 해당 상품을 구매한 매장에 방문해야 가능합니다.
                    - text: 10. 임직원 할인 및 모닝세트 적용 시에도 이벤트 조건에 부합 시 증정 가능합니다.
                    - text: 11. 쿠폰을 사용하시는 경우에도 최종 결제 금액이 이벤트 조건에 부합 시 증정 가능합니다.
                    - text: 12. 스타벅스 카드 충전 금액은 이벤트 적용이 불가합니다.
                    - text: 13. 딜리버스 이용시에는 이벤트 참여 제외됩니다.
