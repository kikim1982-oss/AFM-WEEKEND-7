                  - heading "사이렌오더 별 증정 이벤트 2026-04-24 ~ 2026-05-21" [level=4] [ref=e115]
                  - paragraph [ref=e116]:
                    - link "천안단국대호수" [ref=e117] [cursor=pointer]:
                      - /url: javascript:void(0)
                  - list [ref=e118]: 사이렌 오더를 사용하여 회원 계정에 등록된 스타벅스 카드 또는 계좌 간편결제로 제조 음료 주문 시, 음료당 별 2개 추가 적립
                  - generic [ref=e119]:
                    - text: 1. 스타벅스 리워드 회원이 등록된 스타벅스 카드 또는 계좌 간편 결제한 금액이 방문별 적립 금액(3,000원 이상)을 충족한 경우에만 이벤트 참여 가능합니다.
                    - text: 2. 사이렌 오더 또는 딜리버스 주문 시 적용 가능합니다. (단, 사이렌 오더 비회원 주문 또는 외부 채널 주문 시에는 적용 불가)
                    - text: 3. 병 음료, 생수, 요거트 등 일부 음료는 대상에서 제외되며, 투고백의 경우 1개의 제조 음료로 간주됩니다.
                    - text: 4. 이벤트 기간 내 발생한 정상 거래 외 이벤트 기간 전후 거래 변경 시 본 이벤트 대상에서 제외됩니다. (거래 취소 / 교환 거래 / 거래 취소 후 재결제 / 결제수단 변경 등)
                    - text: 5. 조건 충족 시 방문당 별 1개와 만원별, 지정된 상품 구매 시 이벤트 별이 즉시 적립되며 결제 취소 시 적립된 별은 회수됩니다.
                    - text: 6. 무료 음료 쿠폰 사용 시 이벤트 별은 적립되지 않습니다. (음료 Size up, Extra 등 추가 금액을 등록된 스타벅스 카드로 결제할 경우에도 이벤트 대상에서 제외)
                    - text: 7. 1+1 쿠폰 및 사이즈업 쿠폰 적용 시 등록된 스타벅스 카드로 결제한 음료는 이벤트 대상에 포함됩니다.
                    - text: 8. 회원 본인 계정이 아닌 다른 회원 계정에 등록된 스타벅스 카드 / 스타벅스 모바일 상품권 / 스타벅스 모바일 카드 등과의 복합 결제 시, 이벤트 참여가 정상적으로 되지 않을 수 있으니 이 점 유의하시기 바랍니다.
                    - text: 9. 스타벅스 모바일 상품권 선물하기는 본 이벤트 대상에서 제외됩니다.
                    - text: 10. 본 이벤트 조건 충족 시, 임직원 할인 및 굿 이브닝 혜택 적용 시에도 이벤트 참여 가능합니다.
                    - text: 11. 본 이벤트로 적립된 이벤트 별의 유효기간은 적립일로부터 90일이며, 유효기간 만료 시 별도의 안내 없이 별은 소멸됩니다.
                    - text: 12. 일부 매장에서는 매장 내 비치된 매장 QR코드를 통해서만 사이렌 오더 주문이 가능하며, 해당 주문은 매장 POS 주문으로 적용됩니다.
                    - text: 13. 일부 매장에서는 특정 시간대 사이렌 오더 주문이 불가할 수 있습니다.
