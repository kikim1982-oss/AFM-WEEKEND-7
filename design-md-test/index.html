  <style>
    :root {

      --surface: #121318;
      --surface-bright: #38393f;
      --surface-container-lowest: #0d0e13;
      --surface-container-low: #1a1b21;
      --surface-container: #1e1f25;
      --surface-container-high: #292a2f;
      --surface-container-highest: #34343a;
      --surface-variant: #34343a;
      --on-surface: #e3e1e9;
      --on-surface-variant: #d0c6ab;
      --outline: #999077;
      --outline-variant: #4d4732;
      --primary: #fff6df;
      --primary-container: #ffd700;
      --primary-fixed: #ffe16d;
      --primary-fixed-dim: #e9c400;
      --on-primary: #3a3000;
      --secondary: #bdf4ff;
      --secondary-container: #00e3fd;
      --on-secondary: #00363d;
      --tertiary: #fcf3ff;
      --tertiary-container: #e7d1ff;
      --on-tertiary-container: #6b5586;

      /* Spacing */
      --gutter: 24px;
      --margin-mobile: 16px;
      --margin-desktop: 64px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--surface);
      color: var(--on-surface);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Typography tokens */
    .t-headline-xl {
      font-family: "Space Grotesk", system-ui, sans-serif;

      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }
    .t-headline-lg {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: clamp(32px, 4.5vw, 48px);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }
    .t-headline-md {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.25;
    }
    @media (min-width: 768px) {
      .t-headline-md {
        font-size: 32px;
        line-height: 40px;
      }
    }
    .t-body-lg {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 18px;
      line-height: 28px;
    }
    .t-body-md {
      font-family: "Inter", system-ui, sans-serif;
      font-size: 16px;
      line-height: 24px;
    }
    .t-label-md {
      font-family: "Space Grotesk", system-ui, sans-serif;
      font-size: 14px;
      font-weight: 500;
      line-height: 20px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* Glow text for hero headline */
    .glow-headline {
      text-shadow: 0 0 40px rgba(255, 215, 0, 0.28),
        0 0 80px rgba(255, 215, 0, 0.15);
    }

    /* Glass level-2 */
    .glass {
      background: rgba(52, 52, 58, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .glass-strong {
      background: rgba(30, 31, 37, 0.55);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-hover {
      transition: transform 400ms cubic-bezier(0.16, 1, 0.3, 1),
        box-shadow 400ms ease, background-color 400ms ease,
        border-color 400ms ease;
    }
    .glass-hover:hover {
      background: rgba(56, 57, 63, 0.4);
      transform: translateY(-4px);
      border-color: rgba(189, 244, 255, 0.25);
      box-shadow: 0 0 0 1px rgba(189, 244, 255, 0.15),
        0 30px 80px -20px rgba(0, 227, 253, 0.25),
        0 0 60px -10px rgba(0, 227, 253, 0.2);
    }

    /* Primary button — diamond ring */
    .btn-primary {
      background: var(--primary);
      color: var(--on-primary);
      transition: all 300ms ease;
      box-shadow: 0 0 0 1px rgba(255, 215, 0, 0.4),
        0 10px 30px -10px rgba(255, 215, 0, 0.35);
    }
    .btn-primary:hover {
      background: var(--primary-fixed);
      box-shadow: 0 0 0 1px rgba(255, 215, 0, 0.7),
        0 0 30px rgba(255, 215, 0, 0.45),
        0 20px 50px -10px rgba(255, 215, 0, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--secondary);
      border: 1px solid rgba(189, 244, 255, 0.4);
      transition: all 300ms ease;
    }
    .btn-secondary:hover {
      background: rgba(0, 227, 253, 0.1);
      border-color: rgba(189, 244, 255, 0.8);
      box-shadow: 0 0 0 1px rgba(189, 244, 255, 0.3),
        0 10px 40px -10px rgba(0, 227, 253, 0.4);
    }

    .btn-ghost {
      color: var(--on-surface);
      transition: color 200ms ease, background-color 200ms ease;
    }
    .btn-ghost:hover {
      color: var(--primary-container);
      background: rgba(255, 215, 0, 0.06);
    }

    /* Inputs */
    .input-glass {
      background: var(--surface-container-lowest);
      color: var(--on-surface);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 200ms ease;
    }
    .input-glass::placeholder {
      color: rgba(208, 198, 171, 0.5);
    }
    .input-glass:focus {
      outline: none;
      border-color: var(--secondary);
      box-shadow: 0 0 0 3px rgba(189, 244, 255, 0.15),
        0 0 30px rgba(0, 227, 253, 0.18);
    }

    /* Marquee */
    @keyframes marquee {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(-50%);
      }
    }
    .marquee-track {
      animation: marquee 40s linear infinite;
    }

    /* Slow orbit rotation */
    @keyframes orbit-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .orbit-slow {
      animation: orbit-slow 80s linear infinite;
    }
    @keyframes orbit-rev {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    .orbit-rev {
      animation: orbit-rev 120s linear infinite;
    }

    /* Soft pulse */
    @keyframes pulse-soft {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .pulse-soft {
      animation: pulse-soft 4s ease-in-out infinite;
    }

    /* Cosmic corona — large fixed background blobs */
    .corona-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .corona-1 {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 1400px;
      height: 1400px;
      border-radius: 50%;
      background: radial-gradient(
        circle at center,
        rgba(231, 209, 255, 0.18) 0%,
        rgba(0, 227, 253, 0.08) 22%,
        rgba(18, 19, 24, 0) 55%
      );
      filter: blur(20px);
    }
    .corona-2 {
      position: absolute;
      bottom: -40%;
      right: -10%;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      background: radial-gradient(
        circle at center,
        rgba(255, 215, 0, 0.1) 0%,
        rgba(255, 215, 0, 0.03) 30%,
        rgba(18, 19, 24, 0) 60%
      );
      filter: blur(40px);
    }
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
    }

    /* Image fallback gradient */
    .img-fallback {
      background: radial-gradient(
          circle at 30% 30%,
          rgba(231, 209, 255, 0.3),
          rgba(18, 19, 24, 0.9) 60%
        ),
        linear-gradient(135deg, #1e1f25, #0d0e13);
    }

    /* Underline link */
    .ul-link {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--secondary);
      transition: color 200ms ease;
    }
    .ul-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      height: 1px;
      width: 100%;
      background: currentColor;
      transform: scaleX(0.3);
      transform-origin: left;
      transition: transform 300ms ease;
    }
    .ul-link:hover::after {
      transform: scaleX(1);
    }
    .ul-link:hover {
      color: var(--secondary-container);
    }

    /* Scrollbar hide */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Section divider hairline */
    .hairline {
      height: 1px;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.08),
        transparent
      );
    }

    /* Sheet animation */
    @keyframes sheetIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }
    .sheet-anim {
      animation: sheetIn 320ms cubic-bezier(0.16, 1, 0.3, 1);
    }
  </style>
</head>

    const CartContext = React.createContext(null);

      const [count, setCount] = useState(0);

      const add = useCallback(() => setCount((c) => c + 1), []);
      const toggleWish = useCallback((id) => {

      return (

                    <div className="font-display font-semibold">AD Magazine</div>
                    <div className="t-label-md text-on-surface-variant/70">Spring 2026</div>
                  </div>
                </div>
              </GlassCard>

              <GlassCard className="p-8 lg:p-12 relative overflow-hidden">
                <div
                  className="absolute -top-10 -right-10 w-56 h-56 rounded-full pointer-events-none"
                  style={{
                    background:
                      "radial-gradient(circle, rgba(0,227,253,0.18), transparent 70%)",
                    filter: "blur(20px)",
                  }}
                />
                <div className="font-display text-[80px] leading-none text-secondary/50">

                </div>
                <blockquote className="t-headline-md font-display text-on-surface -mt-4">

                  </div>
                </div>

    // ========================================
    // Showroom / Booking
    // ========================================
    function Showroom() {
      const [form, setForm] = useState({ name: "", email: "", date: "", city: "Milano" });
      const [sent, setSent] = useState(false);

      const submit = (e) => {
        e.preventDefault();
        if (!form.name || !form.email) return;
        setSent(true);
      };

      return (
        <section className="relative py-24 lg:py-32">
          <div className="mx-auto max-w-container px-4 lg:px-8 grid lg:grid-cols-12 gap-10 items-start">
            <div className="lg:col-span-5">
              <div className="t-label-md text-secondary mb-4">— Visit</div>
              <h2 className="t-headline-lg font-display">
                Book a private viewing.
              </h2>
              <p className="t-body-lg text-on-surface-variant mt-6 max-w-md">
                Spend an unhurried afternoon among the collection. Espresso, low light, no salesfloor — just objects, properly seen.
              </p>

              <div className="mt-10 flex flex-col gap-5">
                {[
                  ["Milano", "Via Tortona 27 · By appointment"],
                  ["Seoul", "Hannam-daero 12 · By appointment"],
                  ["Copenhagen", "Bredgade 49 · By appointment"],
                ].map(([city, addr]) => (
                  <div key={city} className="flex items-start gap-3">
                    <div className="mt-1 text-secondary"><Icon.Pin /></div>
                    <div>
                      <div className="font-display font-semibold">{city}</div>
                      <div className="t-body-md text-on-surface-variant">{addr}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="lg:col-span-7">
              <GlassCard className="p-6 lg:p-10">
                {!sent ? (
                  <form onSubmit={submit} className="flex flex-col gap-4">
                    <div className="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label className="t-label-md text-on-surface-variant block mb-2">Name</label>
                        <Input
                          required
                          placeholder="Your name"
                          value={form.name}
                          onChange={(e) => setForm({ ...form, name: e.target.value })}
                        />
                      </div>
                      <div>
                        <label className="t-label-md text-on-surface-variant block mb-2">Email</label>
                        <Input
                          required
                          type="email"
                          placeholder="you@studio.com"
                          value={form.email}
                          onChange={(e) => setForm({ ...form, email: e.target.value })}
                        />
                      </div>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label className="t-label-md text-on-surface-variant block mb-2">Preferred date</label>
                        <Input
                          type="date"
                          value={form.date}
                          onChange={(e) => setForm({ ...form, date: e.target.value })}
                        />
                      </div>
                      <div>
                        <label className="t-label-md text-on-surface-variant block mb-2">Showroom</label>
                        <select
                          className="input-glass w-full h-12 px-4 rounded-lg t-body-md font-body"
                          value={form.city}
                          onChange={(e) => setForm({ ...form, city: e.target.value })}
                        >
                          <option>Milano</option>
                          <option>Seoul</option>
                          <option>Copenhagen</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="t-label-md text-on-surface-variant block mb-2">Note (optional)</label>
                      <textarea
                        rows={3}
                        placeholder="Anything we should prepare for your visit?"
                        className="input-glass w-full p-4 rounded-lg t-body-md font-body resize-none"
                      />
                    </div>
                    <div className="flex items-center justify-between flex-wrap gap-4 pt-2">
                      <p className="t-label-md text-on-surface-variant/70">
                        We respond within one working day.
                      </p>
                      <Button variant="primary" size="lg" type="submit">
                        Request Viewing <Icon.Arrow />
                      </Button>
                    </div>
                  </form>
                ) : (
                  <div className="py-10 text-center">
                    <div
                      className="mx-auto w-14 h-14 rounded-full flex items-center justify-center mb-6"
                      style={{
                        background: "rgba(0,227,253,0.15)",
                        color: "#00e3fd",
                        border: "1px solid rgba(0,227,253,0.35)",
                        boxShadow: "0 0 32px rgba(0,227,253,0.3)",
                      }}
                    >
                      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12l4 4L19 7"/></svg>
                    </div>
                    <h3 className="t-headline-md font-display">Request received.</h3>
                    <p className="t-body-md text-on-surface-variant mt-3 max-w-md mx-auto">
                      Thank you, {form.name || "friend"}. We will be in touch about your visit to {form.city} shortly.
                    </p>
                  </div>
                )}
              </GlassCard>
            </div>
          </div>
        </section>
      );
    }

    // ========================================
    // Newsletter
    // ========================================
    function Newsletter() {
      const [email, setEmail] = useState("");
      const [sent, setSent] = useState(false);
      const submit = (e) => {
        e.preventDefault();
        if (!email) return;
        setSent(true);
        setEmail("");
      };

      return (
        <section className="relative py-24 lg:py-32">
          <div className="mx-auto max-w-container px-4 lg:px-8">
            <GlassCard className="relative overflow-hidden p-8 lg:p-16">
              <div
                className="absolute -top-32 -left-32 w-[500px] h-[500px] rounded-full pointer-events-none"
                style={{
                  background:
                    "radial-gradient(circle, rgba(0,227,253,0.18), transparent 65%)",
                  filter: "blur(30px)",
                }}
              />
              <div
                className="absolute -bottom-32 -right-32 w-[500px] h-[500px] rounded-full pointer-events-none"
                style={{
                  background:
                    "radial-gradient(circle, rgba(255,215,0,0.14), transparent 65%)",
                  filter: "blur(30px)",
                }}
              />

              <div className="relative grid lg:grid-cols-12 gap-10 items-center">
                <div className="lg:col-span-7">
                  <div className="t-label-md text-secondary mb-4">— Transmissions</div>
                  <h2 className="t-headline-lg font-display">
                    Receive transmissions
                    <br />
                    <span className="text-on-surface-variant">from the studio.</span>
                  </h2>
                  <p className="t-body-md text-on-surface-variant mt-4 max-w-md">
                    Quiet dispatches — new pieces, atelier notes, occasional film. Roughly once a month.
                  </p>
                </div>

                <div className="lg:col-span-5">
                  {!sent ? (
                    <form onSubmit={submit} className="flex flex-col gap-3">
                      <Input
                        type="email"
                        placeholder="you@studio.com"
                        value={email}
                        onChange={(e) => setEmail(e.target.value)}
                      />
                      <Button variant="secondary" type="submit" className="w-full">
                        Subscribe <Icon.Arrow />
                      </Button>
                      <p className="t-label-md text-on-surface-variant/60 mt-1">
                        By subscribing you agree to our privacy policy.
                      </p>
                    </form>
                  ) : (
                    <div
                      className="rounded-xl p-5 flex items-center gap-3"
                      style={{
                        background: "rgba(0,227,253,0.10)",
                        border: "1px solid rgba(189,244,255,0.35)",
                        boxShadow: "0 0 30px rgba(0,227,253,0.25)",
                      }}
                    >
                      <div
                        className="w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0"
                        style={{
                          background: "rgba(0,227,253,0.2)",
                          color: "#00e3fd",
                        }}
                      >
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12l4 4L19 7"/></svg>
                      </div>
                      <div>
                        <div className="font-display font-semibold text-secondary">
                          You're on the list.
                        </div>
                        <div className="t-body-md text-on-surface-variant">
                          The first transmission lands soon.
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </GlassCard>
          </div>
        </section>
      );
    }

        {

            <div className="flex flex-col md:flex-row md:items-center justify-between gap-4">

              </p>
              <p className="t-label-md text-on-surface-variant/60">

    function App() {
      return (

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
